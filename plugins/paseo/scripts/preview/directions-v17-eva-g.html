<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime · v17 · G × EVA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font: 12px -apple-system, "SF Pro Text", sans-serif; padding: 24px; color: #e4e7ec; }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .intro { color: #899097; font-size: 12px; margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: repeat(3, 390px); gap: 22px; align-items: start; }
  .col > .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .col > .sub { color: #899097; font-size: 11px; margin-bottom: 12px; min-height: 44px; }
  .cell { margin-bottom: 14px; }
  .cell .lab { color: #5c6167; font-size: 10px; letter-spacing: .5px; margin-bottom: 4px; }
  .chat { background: #0f1114; border-radius: 10px; padding: 12px 16px; }
  .m { font-family: Menlo, ui-monospace, monospace; font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; }
  .pre { white-space: pre-wrap; word-break: break-all; }
  .out { color: #9aa0a8; }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .grow { flex: 1; min-width: 0; }
  .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { flex: none; color: #899097; display: flex; gap: 8px; }
  .chev { color: #3f434a; }
  .foot { font-size: 11px; line-height: 16px; color: #5c6167; }

  /* G×EVA 共有骨架：整卡状态色染色（G 主体）+ EVA 点缀 */
  .ge { position: relative; overflow: hidden; border-radius: 4px; padding: 0 14px 12px; }
  .ge.ok  { --c:255,122,26;  background: linear-gradient(135deg, rgba(255,122,26,.14), rgba(255,122,26,.02) 65%); border: 1px solid rgba(255,122,26,.40); }
  .ge.bad { --c:255,42,42;   background: linear-gradient(135deg, rgba(255,42,42,.16), rgba(255,42,42,.02) 65%); border: 1px solid rgba(255,42,42,.45); }
  .ge.run { --c:255,176,0;   background: linear-gradient(135deg, rgba(255,176,0,.13), rgba(255,176,0,.02) 65%); border: 1px solid rgba(255,176,0,.40); }
  .ge .bar { display: flex; align-items: stretch; height: 18px; margin: 0 -14px; }
  .ge .haz { width: 40px; background: repeating-linear-gradient(-45deg, rgb(var(--c)) 0 5px, #000 5px 10px); }
  .ge .ktag { background: rgb(var(--c)); color: #000; font: 900 10px/18px "Hiragino Sans", sans-serif; padding: 0 8px; letter-spacing: 3px; }
  .ge .tcode { margin-left: auto; color: rgb(var(--c)); font: 700 10px/18px Menlo; letter-spacing: 1px; padding: 0 2px; }
  .ge .ttl { font: 900 20px/23px "Hiragino Mincho ProN", "Times New Roman", serif; transform: scaleX(.80); transform-origin: left; width: 125%; color: #f4f1ea; padding: 7px 0 1px; letter-spacing: -.5px; }
  .ge .body { margin-top: 5px; position: relative; } .ge .foot { margin-top: 6px; position: relative; }
  .ge .wm { position: absolute; pointer-events: none; font-family: "Hiragino Mincho ProN", "Times New Roman", serif; font-weight: 900; }

  /* V1 · 底部明清水印（G 原版位置，换明朝体，放在独立底带不压输出） */
  .V1 .wm { right: -4px; bottom: -14px; font-size: 64px; line-height: 1; letter-spacing: -3px; color: transparent; -webkit-text-stroke: 1.2px rgba(var(--c),.30); }
  .V1 .footer-zone { position: relative; height: 46px; margin-top: 8px; }
  .V1 .foot { position: absolute; left: 0; bottom: 4px; }
  /* V2 · 右上角半透明实心水印 + 无底部占位 */
  .V2 .wm { right: -8px; top: 14px; font-size: 84px; line-height: 1; letter-spacing: -4px; color: rgba(var(--c),.08); }
  .V2 .ttl, .V2 .body, .V2 .foot { max-width: 78%; }
  /* V3 · 左侧粗色条 + 竖排片假名水印（G2 侧栏的 EVA 化） */
  .V3 { padding-left: 20px; }
  .V3 .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: rgb(var(--c)); }
  .V3 .rail::after { content: ""; position: absolute; left: 0; top: 0; width: 6px; height: 22px; background: repeating-linear-gradient(-45deg, rgb(var(--c)) 0 5px, #000 5px 10px); }
  .V3 .wm { right: 2px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; font-size: 30px; letter-spacing: 8px; color: rgba(var(--c),.22); }
  .V3 .ttl, .V3 .body, .V3 .foot { padding-right: 30px; }
</style>
</head>
<body>
<h1>v17 · G 为主体 × EVA 点缀</h1>
<div class="intro">G 的整卡状态色染色保留，换成 NERV 调色（橙/红/黄）。EVA 元素只做点缀：警示斜纹、片假名标签、压扁明朝体标题、大字水印。水印一律避开输出区。</div>
<div class="grid" id="grid"></div>
<script>
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const cases = [
 {lab:"短命令 · 收起", cmd:"npm test", st:"ok", t:"00:45", open:false, out:"ℹ fail 0\nℹ duration_ms 336.6"},
 {lab:"短命令 · 展开", cmd:"npm test", st:"ok", t:"00:45", open:true, out:"ℹ tests 25\nℹ suites 7\nℹ pass 25\nℹ fail 0\nℹ duration_ms 336.6", foot:"mt_9cec1234 · 19:31:28 → 19:32:13"},
 {lab:"长单行 · 展开", cmd:"rg -n --hidden -g '!node_modules' \"outputPath|outputTail\" plugins/paseo/client plugins/paseo/shared src", st:"ok", t:"00:01", open:true, out:"client/task-view.tsx:66:  const source = live ? task.outputTail\nshared/tasks.ts:41:  outputPath?: string;", foot:"mt_51ab07e2 · 19:40:02 → 19:40:03"},
 {lab:"多行失败 · 展开", cmd:"for f in test/*.test.ts; do\n  node --test \"$f\" || exit 1\ndone", st:"bad", t:"00:12", word:"exit 1", open:true, out:"✔ board renders (4ms)\n✖ drawer shows command once\n  AssertionError: 2 !== 1", foot:"mt_77d0c9aa · 19:44:10 → 19:44:22"},
 {lab:"运行中 · 收起", cmd:"npm run build -- --watch", st:"run", t:"02:13", open:false, out:"[watch] build started\n  dist/client.js  41.2kb\n  dist/server.js  12.8kb\n[watch] build finished\n[watch] waiting for changes…"},
];
const flat = cmd => cmd.replace(/\s+/g," ");
const meta = c => `<span class="meta">${c.word?`<span style="color:#ef7d6b">${c.word}</span>`:`<span>${c.t}</span>`}<span class="chev">${c.open?"⌃":"⌄"}</span></span>`;
const outText = c => esc(c.open ? c.out : c.out.split("\n").slice(c.st==="run"?-5:-2).join("\n"));
const JP = c => c.st==="ok"?"完了":c.st==="bad"?"拒絶":"作動中";
const EN = c => c.st==="ok"?"ALL CLEAR":c.st==="bad"?"PATTERN BLUE":"SYNC";
const cmdH = c => c.open?esc(c.cmd):esc(flat(c.cmd));
const ge = (cls, wmHtml, c) => `<div class="ge ${cls} ${c.st} m">
  <div class="bar"><div class="haz"></div><div class="ktag">${JP(c)}</div><div class="tcode">${c.word?c.word.toUpperCase()+" · ":""}T+${c.t}</div></div>
  <div class="row"><div class="grow ttl ${c.open?"pre":"clip"}">${cmdH(c)}</div>${meta(c)}</div>
  <div class="body pre out">${outText(c)}</div>
  ${wmHtml(c)}
  ${c.open?`<div class="foot">${c.foot}</div>`:""}
</div>`;
const styles = {
 V1:{title:"V1 · 底带描边水印",sub:"G 的大字水印改描边明朝体，放进卡片底部一条独立区域，和输出完全分层。斜纹条+片假名在最顶。",r:c=>{
   const w = cc => `<div class="footer-zone"><div class="wm">${EN(cc)}</div>${cc.open?"":""}</div>`;
   return `<div class="ge V1 ${c.st} m"><div class="bar"><div class="haz"></div><div class="ktag">${JP(c)}</div><div class="tcode">${c.word?c.word.toUpperCase()+" · ":""}T+${c.t}</div></div><div class="row"><div class="grow ttl ${c.open?"pre":"clip"}">${cmdH(c)}</div>${meta(c)}</div><div class="body pre out">${outText(c)}</div><div class="footer-zone"><div class="wm">${EN(c)}</div>${c.open?`<div class="foot">${c.foot}</div>`:""}</div></div>`; }},
 V2:{title:"V2 · 右上实心水印",sub:"实心大字压在右上，内容区只占左 78%，水印永远不碰文字。最像 G 原版的位置感。",r:c=>ge("V2", cc=>`<div class="wm">${EN(cc)}</div>`, c)},
 V3:{title:"V3 · 左色条 + 竖排片假名",sub:"左边整条状态色竖条（顶端接斜纹），状态词竖排成右缘水印。最收敛的一款。",r:c=>ge("V3", cc=>`<div class="wm">${JP(cc)}</div>`, c)},
};
document.getElementById("grid").innerHTML = Object.values(styles).map(s=>`<div class="col"><div class="title">${s.title}</div><div class="sub">${s.sub}</div>${
  cases.map(c=>`<div class="cell"><div class="lab">${c.lab}</div><div class="chat">${s.r(c)}</div></div>`).join("")}</div>`).join("");
</script>
</body>
</html>
