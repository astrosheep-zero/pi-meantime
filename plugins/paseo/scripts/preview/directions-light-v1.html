<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime · Light 质感三方向</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f2f4f7; font: 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; padding: 28px; color: #14171f; -webkit-font-smoothing: antialiased; }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #111318; }
  .intro { color: #5b626e; font-size: 12px; margin-bottom: 20px; max-width: 1080px; line-height: 18px; }
  .cols { display: grid; grid-template-columns: repeat(3, 390px); gap: 22px; align-items: start; }
  .col > .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; color: #111318; }
  .col > .sub { color: #646b78; font-size: 11px; margin-bottom: 12px; min-height: 32px; line-height: 16px; }
  .cell { margin-bottom: 14px; }
  .lab { color: #7b8390; font-size: 10px; letter-spacing: .5px; margin-bottom: 5px; font-weight: 500; }
  /* 真实亮色聊天背景通常是纯白或近白，之前白卡叠灰底掩盖了白卡本身发飘的问题 */
  .chat { background: #ffffff; border-radius: 10px; padding: 12px 13px; box-shadow: 0 1px 3px rgba(15,23,42,.05), 0 0 0 1px rgba(15,23,42,.05); }

  .m { font-family: Menlo, ui-monospace, "SF Mono", monospace; font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; }
  .head { display: flex; align-items: flex-start; gap: 8px; }
  .cmd { flex: 1; min-width: 0; font-weight: 600; }
  .cmd.clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmd.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmd .arg { font-weight: 400; }
  .meta { flex: none; display: flex; align-items: center; gap: 7px; height: 18px; }
  .chev { width: 10px; height: 10px; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .card.open .chev { transform: rotate(180deg); }
  .out { white-space: pre-wrap; overflow-wrap: anywhere; }
  .foot { margin-top: 9px; display: flex; gap: 6px; font-size: 10.5px; line-height: 15px; }

  /* ========== A · 浓彩水洗 + 灯环底座 + 实心胶囊徽章 ========== */
  .col-a .st-ok   { --c:22,147,78;  --ink:#0f5c31; --tint:#f3faf6; }
  .col-a .st-bad  { --c:220,53,40;  --ink:#9e1f15; --tint:#fdf4f3; }
  .col-a .st-run  { --c:212,123,8;  --ink:#8c4d00; --tint:#fdf8f0; }
  .col-a .st-wto  { --c:212,123,8;  --ink:#8c4d00; --tint:#fdf8f0; }
  .col-a .st-wint { --c:82,102,128; --ink:#364659; --tint:#f4f6f9; }

  .col-a .card {
    border-radius: 7px; padding: 11px 13px;
    background-color: var(--tint);
    background-image:
      radial-gradient(95% 105% at 0% 0%, rgba(var(--c),.18), transparent 58%),
      linear-gradient(180deg, rgba(var(--c),.07), rgba(var(--c),.015));
    border: 1px solid rgba(var(--c),.34);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(15,23,42,.06);
  }
  .col-a .sdot {
    width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: none;
    background: rgb(var(--c));
    box-shadow: 0 0 0 2.5px rgba(var(--c),.18);
  }
  .col-a .cmd { color: #12161c; }
  .col-a .cmd .arg { color: #555f6d; }
  .col-a .meta { color: #5f6876; }
  .col-a .chip {
    font-size: 10.5px; line-height: 15px; padding: 0 5.5px; border-radius: 3px; font-weight: 600;
    color: #ffffff; background: rgb(var(--c));
    box-shadow: 0 1px 1px rgba(var(--c),.28), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .col-a .waited { color: #747d8b; } .col-a .waited b { color: #1e242d; font-weight: 500; }
  .col-a .chev { stroke: #76808f; }
  .col-a .rule { height: 1px; margin: 8px 0 7px; background: linear-gradient(90deg, rgba(var(--c),.36), rgba(var(--c),.03) 88%); }
  .col-a .out { color: #353d48; }
  .col-a .out .d { color: #848e9c; } .col-a .out .ok { color: #16934e; } .col-a .out .bad { color: #dc3528; }
  .col-a .foot { color: #788190; } .col-a .foot .sep { color: #b5bcc7; }

  /* ========== B · 阳极氧化灰铝盘 + 左侧 2.5px 彩脊 ========== */
  .col-b .st-ok   { --c:24,148,79;  --ink:#126b39; }
  .col-b .st-bad  { --c:222,55,42;  --ink:#a82218; }
  .col-b .st-run  { --c:214,126,10; --ink:#945200; }
  .col-b .st-wto  { --c:214,126,10; --ink:#945200; }
  .col-b .st-wint { --c:85,105,132; --ink:#3b4b61; }

  .col-b .card {
    border-radius: 7px; padding: 11px 13px;
    background-color: #f3f5f8;
    background-image:
      radial-gradient(90% 100% at 0% 0%, rgba(var(--c),.15), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.55), rgba(241,244,248,.4));
    border: 1px solid rgba(15,23,42,.11);
    box-shadow: inset 2.5px 0 0 rgb(var(--c)), inset 0 1px 0 rgba(255,255,255,.95), 0 1px 2px rgba(15,23,42,.05);
  }
  .col-b .sdot {
    width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: none;
    background: rgb(var(--c));
    box-shadow: 0 0 0 2px rgba(var(--c),.16);
  }
  .col-b .cmd { color: #11151b; }
  .col-b .cmd .arg { color: #5b6472; }
  .col-b .meta { color: #636c7a; }
  .col-b .chip {
    font-size: 10.5px; line-height: 15px; padding: 0 5px; border-radius: 3px; font-weight: 500;
    color: var(--ink); background: rgba(var(--c),.15);
    box-shadow: inset 0 0 0 .75px rgba(var(--c),.42);
  }
  .col-b .waited { color: #767f8d; } .col-b .waited b { color: #1e242d; font-weight: 500; }
  .col-b .chev { stroke: #76808f; }
  .col-b .rule { height: 1px; margin: 8px 0 7px; background: linear-gradient(90deg, rgba(var(--c),.34), rgba(15,23,42,.05) 75%, transparent); }
  .col-b .out { color: #363e4a; }
  .col-b .out .d { color: #87909e; } .col-b .out .ok { color: #18944f; } .col-b .out .bad { color: #de372a; }
  .col-b .foot { color: #798290; } .col-b .foot .sep { color: #b7bec9; }

  /* ========== C · 白壳嵌黑屏（Braun / TE 烟熏石墨液晶窗） ========== */
  .col-c .st-ok   { --c:127,178,106; }
  .col-c .st-bad  { --c:239,125,107; }
  .col-c .st-run  { --c:233,180,90;  }
  .col-c .st-wto  { --c:233,180,90;  }
  .col-c .st-wint { --c:148,162,180; }

  .col-c .card {
    border-radius: 7px; padding: 11px 13px;
    background-color: #16191e;
    background-image:
      radial-gradient(95% 95% at 0% 0%, rgba(var(--c),.15), transparent 58%),
      linear-gradient(180deg, rgba(var(--c),.055), rgba(var(--c),.015));
    border: 1px solid rgba(15,23,42,.82);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 0 1px rgba(var(--c),.22), 0 2px 6px rgba(15,23,42,.14);
  }
  .col-c .sdot {
    width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: none;
    background: rgb(var(--c));
    box-shadow: 0 0 6px rgba(var(--c),.5);
  }
  .col-c .cmd { color: #eef0f3; }
  .col-c .cmd .arg { color: #9aa0a8; }
  .col-c .meta { color: #899097; }
  .col-c .chip {
    font-size: 10.5px; line-height: 15px; padding: 0 5px; border-radius: 3px;
    color: rgb(var(--c)); background: rgba(var(--c),.14);
    box-shadow: inset 0 0 0 .5px rgba(var(--c),.34);
  }
  .col-c .waited { color: #6e757d; } .col-c .waited b { color: #c8cdd3; font-weight: 400; }
  .col-c .chev { stroke: #646a72; }
  .col-c .rule { height: 1px; margin: 8px 0 7px; background: linear-gradient(90deg, rgba(var(--c),.26), rgba(var(--c),0) 85%); }
  .col-c .out { color: #a7adb5; }
  .col-c .out .d { color: #61676e; } .col-c .out .ok { color: #7fb26a; } .col-c .out .bad { color: #ef7d6b; }
  .col-c .foot { color: #575d65; } .col-c .foot .sep { color: #3b3f46; }
</style>
</head>
<body>
<h1>meantime · 亮色主题为什么显寡淡？三路破局对比（均置于纯白 #fff 聊天底上）</h1>
<div class="intro">亮色寡淡是因为白底无法「发光」——把暗色的低透明染色照搬到白卡上只剩一层苍白粉笔水。要在亮色做出同等机能质感，有三条完全不同的路：<b>A 提高颜料浓度 + 灯座环 + 实心胶囊</b>、<b>B 灰铝机身 + 左侧彩脊</b>、<b>C 干脆像白壳仪器嵌一块烟熏黑液晶窗</b>。</div>
<div class="cols" id="cols"></div>
<script>
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const cases = [
 {lab:"短命令 · 收起", cmd:"npm test", st:"ok", t:"00:45", open:false, out:"ℹ fail 0\nℹ duration_ms 336.6"},
 {lab:"短命令 · 展开", cmd:"npm test", st:"ok", t:"00:45", open:true, out:"ℹ tests 25\nℹ suites 7\nℹ pass 25\nℹ fail 0\nℹ duration_ms 336.6", foot:["mt_9cec1234","19:31:28 → 19:32:13"]},
 {lab:"多行失败 · 展开", cmd:"for f in test/*.test.ts; do\n  node --test \"$f\" || exit 1\ndone", st:"bad", t:"00:12", chip:"exit 1", open:true, out:"✔ board renders (4ms)\n✖ drawer shows command once\n  AssertionError: 2 !== 1", foot:["mt_77d0c9aa","19:44:10 → 19:44:22"]},
 {lab:"运行中 · 收起", cmd:"npm run build -- --watch", st:"run", t:"02:13", open:false, out:"[watch] build started\n  dist/client.js  41.2kb\n  dist/server.js  12.8kb\n[watch] build finished\n[watch] waiting for changes…"},
 {lab:"wait 到期 · 收起", cmd:"npm run e2e -- --shard=2/4", st:"wto", t:"12:00", chip:"timeout", wait:true, open:false, out:"ℹ pass 24\nℹ running shard 2/4…"},
 {lab:"wait 被打断 · 展开", cmd:"python3 scripts/train_eval.py --epochs 20", st:"wint", t:"04:32", chip:"interrupted", wait:true, open:true, out:"epoch 4/20 · loss 0.184\nepoch 5/20 · loss 0.161", foot:["mt_51ab07e2","started 20:11:03 · /tmp/mt_51ab07e2.log"]},
];
const chev = `<svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5"/></svg>`;
const cmdHtml = c => {
  const s = c.open ? c.cmd : c.cmd.replace(/\s+/g," ");
  const [first, ...rest] = esc(s).split(" ");
  return first + (rest.length ? ` <span class="arg">${rest.join(" ")}</span>` : "");
};
const colorOut = s => esc(s).replace(/^(\s*)ℹ/gm,'$1<span class="d">ℹ</span>').replace(/^(\s*)✔/gm,'$1<span class="ok">✔</span>').replace(/^(\s*)✖/gm,'$1<span class="bad">✖</span>');
const outHtml = c => `<div class="out">${colorOut(c.out)}</div>`;
const meta = c => `<span class="meta">${c.chip?`<span class="chip">${c.chip}</span>`:""}${c.wait?`<span class="waited">waited <b>${c.t}</b></span>`:`<span>${c.t}</span>`}${chev}</span>`;
const card = c => `<div class="card m st-${c.st}${c.open?" open":""}">
  <div class="head"><span class="sdot"></span><div class="cmd ${c.open?"wrap":"clip"}">${cmdHtml(c)}</div>${meta(c)}</div>
  <div class="rule"></div>${outHtml(c)}
  ${c.open?`<div class="foot"><span>${c.foot[0]}</span><span class="sep">·</span><span>${c.foot[1]}</span></div>`:""}</div>`;

const cols = [
  {title:"A · 浓彩水洗纸 + 灯环 + 实心胶囊", sub:"色底带明确冷暖底色，左上浓晕染，圆点加 2.5px 灯座环，exit/timeout 改实心高反差胶囊。", cls:"col-a"},
  {title:"B · 灰铝仪器盘 + 2.5px 左侧彩脊", sub:"统一冷灰金属底盘从纯白聊天流里沉下去，靠左侧饱和彩脊 + 左上色晕定调。", cls:"col-b"},
  {title:"C · 白壳嵌黑屏（常驻暗色终端窗）", sub:"像博朗白壳收音机上的黑色液晶窗：亮色聊天流里终端卡依然保持烟熏黑高光质感。", cls:"col-c"},
];
document.getElementById("cols").innerHTML = cols.map(col=>`<div class="col ${col.cls}"><div class="title">${col.title}</div><div class="sub">${col.sub}</div>${
  cases.map(c=>`<div class="cell"><div class="lab">${c.lab}</div><div class="chat">${card(c)}</div></div>`).join("")}</div>`).join("");
</script>
</body>
</html>
