<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime card · 5 directions v2</title>
<style>
  :root { --mono: ui-monospace, Menlo, monospace; --sans: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: #777; }
  .sheet { display: flex; }
  .col { flex: 1; padding: 30px 30px 60px; }
  .col.light { --s0:#ffffff; --s1:#f5f6f8; --s2:#edeff2; --bd:rgba(20,24,28,.12); --bd2:rgba(20,24,28,.22); --fg:#191d21; --mu:#757c85; --ac:#4763e4; --ok:#1a7f47; --er:#c23434; --wn:#a3620b; background: var(--s0); }
  .col.dark  { --s0:#0f1113; --s1:#16181b; --s2:#1d2024; --bd:rgba(235,238,240,.12); --bd2:rgba(235,238,240,.24); --fg:#e8eaec; --mu:#8b929a; --ac:#8ba0f0; --ok:#58c98a; --er:#e47c7c; --wn:#dda24a; background: var(--s0); }
  .theme-tag { color: var(--mu); font-size: 9px; letter-spacing: 3px; margin-bottom: 24px; }
  .dir { margin-bottom: 56px; }
  .dir-tag { color: var(--mu); font-size: 9px; letter-spacing: 3px; }
  .dir-name { color: var(--fg); font-size: 16px; font-weight: 700; margin: 2px 0 18px; }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .mono { font-family: var(--mono); }
  .sc { color: var(--ac); } .sc-ok { color: var(--ok); } .sc-er { color: var(--er); } .sc-wn { color: var(--wn); }
  .bc { background: var(--ac); } .bc-ok { background: var(--ok); } .bc-er { background: var(--er); } .bc-wn { background: var(--wn); }
  .stc-running { color: var(--ac); } .stc-completed { color: var(--ok); } .stc-failed { color: var(--er); } .stc-cancelled { color: var(--wn); }
  .stb-running { background: var(--ac); } .stb-completed { background: var(--ok); } .stb-failed { background: var(--er); } .stb-cancelled { background: var(--wn); }
  .num { font-variant-numeric: tabular-nums; }

  /* ===== D1 · LEDGER 账本 ===== */
  .d1 .card { border-top: 1px solid var(--bd2); border-bottom: 1px solid var(--bd); padding: 12px 0 10px; }
  .d1 .r1 { display: flex; justify-content: space-between; align-items: baseline; }
  .d1 .id { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--fg); letter-spacing: -.2px; }
  .d1 .time { font-size: 11px; color: var(--mu); }
  .d1 .cmd { font-family: var(--mono); font-size: 11px; color: var(--mu); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d1 .r3 { display: flex; justify-content: space-between; align-items: baseline; margin-top: 9px; }
  .d1 .kind { font-size: 9px; letter-spacing: 2.2px; color: var(--mu); font-weight: 600; }
  .d1 .state { font-size: 11px; font-weight: 650; }
  .d1 .state::before { content: "— "; }
  .d1 .multi .card + .card { border-top: none; }

  /* ===== D2 · TRACE 轨道 ===== */
  .d2 .card { display: flex; gap: 14px; }
  .d2 .gutter { width: 15px; flex: none; display: flex; flex-direction: column; align-items: center; }
  .d2 .node { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid; margin-top: 4px; background: var(--s0); flex: none; }
  .d2 .node.running { border-color: var(--ac); } .d2 .node.completed { border-color: var(--ok); }
  .d2 .node.failed { border-color: var(--er); } .d2 .node.cancelled { border-color: var(--wn); }
  .d2 .wire { width: 1px; flex: 1; background: var(--bd); margin-top: 3px; }
  .d2 .body { flex: 1; min-width: 0; padding-bottom: 2px; }
  .d2 .r1 { display: flex; justify-content: space-between; align-items: baseline; }
  .d2 .id { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--fg); }
  .d2 .state { font-size: 10px; font-weight: 650; letter-spacing: .8px; }
  .d2 .sub { font-family: var(--mono); font-size: 11px; color: var(--mu); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d2 .meta { font-size: 10px; color: var(--mu); margin-top: 5px; }
  .d2 .multi { display: flex; flex-direction: column; gap: 16px; }
  .d2 .multi .wire { min-height: 16px; }

  /* ===== D3 · MASTHEAD 刊头 ===== */
  .d3 .kicker { font-size: 9px; letter-spacing: 3px; color: var(--mu); font-weight: 600; }
  .d3 .id { font-size: 21px; font-weight: 700; letter-spacing: -.5px; color: var(--fg); margin-top: 5px; }
  .d3 .rule { border-top: 1px solid var(--bd); margin: 10px 0 8px; }
  .d3 .meta { font-family: var(--mono); font-size: 10.5px; color: var(--mu); line-height: 1.7; }
  .d3 .meta b { font-weight: 600; }
  .d3 .multi .entry + .entry { margin-top: 18px; }
  .d3 .multi .id { font-size: 15px; }

  /* ===== D4 · FENCE 代码块 ===== */
  .d4 .card { background: var(--s2); border-radius: 8px; padding: 11px 13px; font-family: var(--mono); font-size: 11.5px; line-height: 1.75; color: var(--fg); }
  .d4 .dim { color: var(--mu); }
  .d4 .rule { color: var(--bd2); letter-spacing: -1px; user-select: none; }
  .d4 .head { font-size: 9.5px; letter-spacing: 2px; color: var(--mu); margin-bottom: 2px; }
  .d4 .st { font-weight: 700; }

  /* ===== D5 · SIDECAR 旁注 ===== */
  .d5 .card { display: flex; gap: 16px; padding-bottom: 11px; border-bottom: 1px solid var(--bd); }
  .d5 .main { flex: 1; min-width: 0; }
  .d5 .id { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--fg); }
  .d5 .tool { font-size: 11px; color: var(--mu); margin-left: 7px; }
  .d5 .cmd { font-family: var(--mono); font-size: 11px; color: var(--mu); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d5 .side { flex: none; width: 86px; text-align: right; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .d5 .state { font-size: 9.5px; font-weight: 700; letter-spacing: 1.6px; }
  .d5 .time { font-size: 10.5px; color: var(--mu); }
  .d5 .exit { font-size: 10px; color: var(--mu); font-family: var(--mono); }
  .d5 .multi .card { padding: 9px 0 11px; }
  .d5 .multi .card:first-child { padding-top: 0; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const RUN = { id:"mt_9cec89b4", tool:"bash", state:"running", cmd:"npm test -- --watch", time:"45s" };
const OK  = { id:"mt_a1b2c3d4", tool:"bash", state:"completed", cmd:"sleep 45 && echo done", time:"45s", exit:"exit 0" };
const BAD = { id:"mt_deadbeef", tool:"web_fetch", state:"failed", cmd:"curl https://api.example.com/v2/very/long/endpoint/that/overflows", time:"3s", exit:"exit 1" };
const LIST = [RUN, OK, BAD];
const names = { d1:"Ledger 账本", d2:"Trace 轨道", d3:"Masthead 刊头", d4:"Fence 代码块", d5:"Sidecar 旁注" };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const cap = s => s.toUpperCase();

function card(d, t, head){
  switch(d){
    case "d1": return `<div class="card">
      <div class="r1"><span class="id">${t.id}</span><span class="time num">${t.time}</span></div>
      <div class="cmd">${esc(t.cmd)}</div>
      <div class="r3"><span class="kind">${head ?? cap(t.tool)}</span><span class="state stc-${t.state}">${t.state}${t.exit?" · "+t.exit:""}</span></div>
    </div>`;
    case "d2": return `<div class="card">
      <div class="gutter"><div class="node ${t.state}"></div><div class="wire"></div></div>
      <div class="body">
        <div class="r1"><span class="id">${t.id}</span><span class="state stc-${t.state}">${t.state}${t.exit?" · "+t.exit:""}</span></div>
        <div class="sub">${esc(t.cmd)}</div>
        <div class="meta num">${t.tool} · ${t.time}</div>
      </div>
    </div>`;
    case "d3": return `<div class="entry">
      <div class="kicker">${head ?? "MEANTIME"}</div>
      <div class="id">${t.id}</div>
      <div class="rule"></div>
      <div class="meta"><b class="stc-${t.state}">${t.state}</b> · ${t.tool} · ${esc(t.cmd)} · <span class="num">${t.time}</span>${t.exit?" · "+t.exit:""}</div>
    </div>`;
    case "d4": return `<div class="card">
      <div class="head">${head ?? "MEANTIME"}</div>
      ${t.id}  <span class="dim">${esc(t.cmd)}</span><br>
      <span class="rule">────────────────────────────────</span><br>
      <span class="st stc-${t.state}">${t.state}</span> <span class="dim">· ${t.tool} · ${t.time}${t.exit?" · "+t.exit:""}</span>
    </div>`;
    case "d5": return `<div class="card">
      <div class="main">
        <span class="id">${t.id}</span><span class="tool">${t.tool}</span>
        <div class="cmd">${esc(t.cmd)}</div>
      </div>
      <div class="side">
        <span class="state stc-${t.state}">${cap(t.state)}</span>
        <span class="time num">${t.time}</span>
        ${t.exit?`<span class="exit">${t.exit}</span>`:""}
      </div>
    </div>`;
  }
}
function group(d){
  const inner = LIST.map(t=>card(d,t)).join("");
  if (d==="d1") return `<div class="multi">${inner}</div>`;
  if (d==="d2") return `<div class="multi">${inner}</div>`;
  if (d==="d3") return `<div class="multi">${inner}</div>`;
  return inner;
}

const sheet = document.getElementById("sheet");
for (const cls of ["light","dark"]){
  const col = document.createElement("div");
  col.className = "col " + cls;
  col.innerHTML = `<div class="theme-tag">${cls.toUpperCase()}</div>` + Object.keys(names).map(d=>`
    <div class="dir ${d}">
      <div class="dir-tag">${d.toUpperCase()}</div>
      <div class="dir-name">${names[d]}</div>
      <div class="stack">
        ${card(d, RUN, "BACKGROUND TASK")}
        ${card(d, OK, "COMPLETION")}
        ${group(d)}
      </div>
    </div>`).join("");
  sheet.appendChild(col);
}
</script>
</body>
</html>
