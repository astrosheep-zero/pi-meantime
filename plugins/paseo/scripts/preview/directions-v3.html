<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime card · v3 高级感</title>
<style>
  :root { --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: #555; }
  .sheet { display: flex; align-items: flex-start; }
  .col { width: 390px; flex: none; padding: 34px 30px 70px; }
  /* ink discipline: one ink, graded by opacity. accent speaks only when alive or dead */
  .col.light { --ink:24,27,31; --s0:#ffffff; --s1:#f4f5f7; --ac:#3d53d9; --er:#c03434; background: var(--s0); }
  .col.dark  { --ink:233,236,240; --s0:#0e1013; --s1:#171a1e; --ac:#98a8f2; --er:#e08585; background: var(--s0); }
  .ink   { color: rgb(var(--ink)); }
  .ink60 { color: rgba(var(--ink),.60); }
  .ink35 { color: rgba(var(--ink),.35); }
  .hair  { border-color: rgba(var(--ink),.10); }
  .ac { color: var(--ac); } .er { color: var(--er); }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }
  .theme-tag { font-size: 9px; letter-spacing: 3px; color: rgba(var(--ink),.35); margin-bottom: 30px; }
  .dir { margin-bottom: 64px; }
  .dir-name { font-size: 15px; font-weight: 700; color: rgb(var(--ink)); margin-bottom: 3px; }
  .dir-cn { font-size: 12px; color: rgba(var(--ink),.35); margin-bottom: 26px; }
  .stack { display: flex; flex-direction: column; gap: 30px; }

  /* ============ D1 · 墨 INK ============ */
  /* command is the title; id is a footnote; silence means success */
  .d1 .kicker { font-size: 9px; font-weight: 600; letter-spacing: 2.6px; color: rgba(var(--ink),.35); margin-bottom: 10px; }
  .d1 .entry { padding-bottom: 12px; border-bottom: 1px solid rgba(var(--ink),.10); }
  .d1 .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .d1 .cmd { font-family: var(--mono); font-size: 13px; font-weight: 600; color: rgb(var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d1 .time { font-size: 17px; font-weight: 300; color: rgb(var(--ink)); letter-spacing: -.3px; flex: none; }
  .d1 .r2 { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; gap: 14px; }
  .d1 .meta { font-family: var(--mono); font-size: 10px; color: rgba(var(--ink),.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d1 .state { font-size: 11px; font-style: italic; font-weight: 500; flex: none; }
  .d1 .state.done { color: rgba(var(--ink),.35); font-style: normal; }
  .d1 .multi .entry { padding: 12px 0; }
  .d1 .multi .entry:first-child { padding-top: 0; }
  .d1 .multi .entry:last-child { border-bottom: none; padding-bottom: 0; }
  .d1 .multi { border-bottom: 1px solid rgba(var(--ink),.10); padding-bottom: 12px; }

  /* ============ D2 · 刻 ENGRAVED ============ */
  .d2 .plate { background: var(--s1); border-radius: 14px; padding: 15px 16px 13px;
    border: 1px solid rgba(var(--ink),.07);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .light .d2 .plate { box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 10px 26px rgba(20,24,28,.06); }
  .d2 .plate.failed { border-color: rgba(192,52,52,.35); }
  .dark .d2 .plate.failed { border-color: rgba(224,133,133,.30); }
  .d2 .top { display: flex; justify-content: space-between; align-items: baseline; }
  .d2 .label { font-size: 9px; font-weight: 600; letter-spacing: 2.4px; color: rgba(var(--ink),.35); }
  .d2 .state { font-size: 9.5px; font-weight: 700; letter-spacing: 1.8px; }
  .d2 .state.done { color: rgba(var(--ink),.35); }
  .d2 .cmd { font-family: var(--mono); font-size: 12.5px; color: rgb(var(--ink)); margin-top: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d2 .bot { display: flex; justify-content: space-between; margin-top: 11px; padding-top: 9px; border-top: 1px solid rgba(var(--ink),.07); }
  .d2 .id { font-family: var(--mono); font-size: 10px; color: rgba(var(--ink),.35); }
  .d2 .time { font-size: 10.5px; color: rgba(var(--ink),.60); }
  .d2 .multi .plate { padding: 4px 16px; }
  .d2 .multi .row { padding: 10px 0; display: flex; align-items: baseline; gap: 10px; }
  .d2 .multi .row + .row { border-top: 1px solid rgba(var(--ink),.07); }
  .d2 .multi .m-cmd { font-family: var(--mono); font-size: 11.5px; color: rgb(var(--ink)); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d2 .multi .m-time { font-size: 10.5px; color: rgba(var(--ink),.60); flex: none; }
  .d2 .multi .m-state { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; flex: none; width: 74px; text-align: right; }
  .d2 .multi .m-state.done { color: rgba(var(--ink),.35); }

  /* ============ D3 · 志 LOGBOOK ============ */
  .d3 .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .d3 .head .t { font-size: 9px; font-weight: 600; letter-spacing: 2.6px; color: rgba(var(--ink),.35); flex: none; }
  .d3 .head .rule { flex: 1; border-top: 1px solid rgba(var(--ink),.10); }
  .d3 .row { display: flex; gap: 12px; padding: 7px 0; align-items: baseline; }
  .d3 .clock { flex: none; width: 40px; font-size: 10px; color: rgba(var(--ink),.35); }
  .d3 .body { flex: 1; min-width: 0; }
  .d3 .r1 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .d3 .cmd { font-family: var(--mono); font-size: 12px; color: rgb(var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d3 .state { font-size: 10.5px; font-weight: 500; flex: none; }
  .d3 .state.done { color: rgba(var(--ink),.35); }
  .d3 .id { font-family: var(--mono); font-size: 9.5px; color: rgba(var(--ink),.35); margin-top: 2px; }

  /* ============ D4 · 刊 HEADLINE ============ */
  .d4 .entry { padding-bottom: 14px; border-bottom: 1px solid rgba(var(--ink),.10); }
  .d4 .kicker { font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.8px; color: rgba(var(--ink),.35); }
  .d4 .hero { font-size: 17px; font-weight: 650; letter-spacing: -.3px; color: rgb(var(--ink)); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d4 .meta { font-family: var(--mono); font-size: 10.5px; color: rgba(var(--ink),.60); margin-top: 8px; }
  .d4 .meta .st { font-weight: 600; }
  .d4 .multi .entry { padding: 12px 0 14px; }
  .d4 .multi .entry:first-child { padding-top: 0; }
  .d4 .multi .hero { font-size: 14px; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const RUN = { id:"mt_9cec89b4", tool:"bash", state:"running", cmd:"npm test -- --watch", time:"45s", clock:"14:27" };
const OK  = { id:"mt_a1b2c3d4", tool:"bash", state:"completed", cmd:"sleep 45 && echo done", time:"45s", exit:"exit 0", clock:"14:31" };
const BAD = { id:"mt_deadbeef", tool:"web_fetch", state:"failed", cmd:"curl https://api.example.com/v2/endpoint", time:"3s", exit:"exit 1", clock:"14:32" };
const LIST = [RUN, OK, BAD];
const names = { d1:["Ink","墨"], d2:["Engraved","刻"], d3:["Logbook","志"], d4:["Headline","刊"] };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const stWord = (t, cls="") => {
  if (t.state === "completed") return `<span class="state done ${cls}">completed${t.exit?" · "+t.exit:""}</span>`;
  const c = t.state === "running" ? "ac" : "er";
  return `<span class="state ${c} ${cls}">${t.state}${t.exit?" · "+t.exit:""}</span>`;
};

function card(d, t, head){
  switch(d){
    case "d1": return `<div class="entry">
      ${head?`<div class="kicker">${head}</div>`:""}
      <div class="r1"><span class="cmd">${esc(t.cmd)}</span><span class="time num">${t.time}</span></div>
      <div class="r2"><span class="meta">${t.id} · ${t.tool}</span>${stWord(t)}</div>
    </div>`;
    case "d2": return `<div class="plate ${t.state}">
      <div class="top"><span class="label">${head ?? "BACKGROUND TASK"}</span>${stWord(t)}</div>
      <div class="cmd">${esc(t.cmd)}</div>
      <div class="bot"><span class="id">${t.id}</span><span class="time num">${t.time}</span></div>
    </div>`;
    case "d3": return `<div class="row">
      <span class="clock num">${t.clock}</span>
      <div class="body">
        <div class="r1"><span class="cmd">${esc(t.cmd)}</span>${stWord(t)}</div>
        <div class="id">${t.id} · ${t.tool}${t.exit?" · "+t.exit:""}</div>
      </div>
    </div>`;
    case "d4": return `<div class="entry">
      <div class="kicker">${t.id.toUpperCase()}</div>
      <div class="hero">${esc(t.cmd)}</div>
      <div class="meta"><b class="st ${t.state==="running"?"ac":t.state==="failed"?"er":""}" style="${t.state==="completed"?"color:rgba(var(--ink),.60)":""}">${t.state}</b> · ${t.tool} · <span class="num">${t.time}</span>${t.exit?" · "+t.exit:""}</div>
    </div>`;
  }
}
function group(d){
  if (d==="d1") return `<div class="multi">${LIST.map(t=>card("d1",t)).join("")}</div>`;
  if (d==="d2") return `<div class="plate multi">${LIST.map(t=>`
    <div class="row"><span class="m-cmd">${esc(t.cmd)}</span><span class="m-time num">${t.time}</span><span class="m-state ${t.state==="completed"?"done":(t.state==="running"?"ac":"er")}">${t.state.toUpperCase()}</span></div>`).join("")}</div>`;
  if (d==="d3") return `<div><div class="head"><span class="t">MEANTIME · 3 TASKS</span><span class="rule"></span></div>${LIST.map(t=>card("d3",t)).join("")}</div>`;
  if (d==="d4") return `<div class="multi">${LIST.map(t=>card("d4",t)).join("")}</div>`;
}

const sheet = document.getElementById("sheet");
for (const cls of ["light","dark"]){
  const col = document.createElement("div");
  col.className = "col " + cls;
  col.innerHTML = `<div class="theme-tag">${cls.toUpperCase()} · 390PT</div>` + Object.entries(names).map(([d,[en,cn]])=>`
    <div class="dir ${d}">
      <div class="dir-name">${en}</div>
      <div class="dir-cn">${cn}</div>
      <div class="stack">
        ${card(d, RUN, "BACKGROUND TASK")}
        ${card(d, OK, "COMPLETION")}
        ${group(d)}
      </div>
    </div>`).join("");
  sheet.appendChild(col);
}
</script>
</body>
</html>
