<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime card · 5 directions</title>
<style>
  :root {
    --mono: ui-monospace, Menlo, monospace;
    --sans: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: #888; }

  .sheet { display: flex; }
  .col { flex: 1; padding: 28px 26px 40px; }
  .col.light { --s0:#ffffff; --s1:#f5f6f8; --s2:#eceef1; --bd:#e3e5e9; --fg:#1b1e22; --mu:#707781; --ac:#4f6ef7; --ok:#16a34a; --wn:#d97706; --er:#dc2626; background: var(--s0); }
  .col.dark  { --s0:#0f1113; --s1:#16181b; --s2:#1e2125; --bd:#282c31; --fg:#e7e9eb; --mu:#8f959d; --ac:#7c93ff; --ok:#4ade80; --wn:#fbbf24; --er:#f87171; background: var(--s0); }
  .theme-tag { color: var(--mu); font-size: 10px; letter-spacing: 2px; margin-bottom: 18px; }

  .dir { margin-bottom: 44px; }
  .dir-tag { color: var(--mu); font-size: 10px; letter-spacing: 2px; margin-bottom: 4px; }
  .dir-name { color: var(--fg); font-size: 15px; font-weight: 700; margin-bottom: 14px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  /* shared bits */
  .caps { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; color: var(--mu); }
  .idm { font-family: var(--mono); }
  .st-running { color: var(--ac); } .st-started { color: var(--ac); }
  .st-completed { color: var(--ok); } .st-failed { color: var(--er); }
  .st-cancel_requested, .st-cancelled { color: var(--wn); }
  .bg-running { background: var(--ac); } .bg-started { background: var(--ac); }
  .bg-completed { background: var(--ok); } .bg-failed { background: var(--er); }
  .bg-cancel_requested, .bg-cancelled { background: var(--wn); }

  /* ============ D1 · RECEIPT 回执 ============ */
  .d1 .card { border: 1px solid var(--bd); border-radius: 6px; background: var(--s1); padding: 12px 14px; font-family: var(--mono); }
  .d1 .head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px dashed var(--bd); margin-bottom: 9px; }
  .d1 .head .t { font-size: 10px; letter-spacing: 2.5px; color: var(--mu); }
  .d1 .live { font-size: 9px; letter-spacing: 2px; color: var(--ac); }
  .d1 .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 3px 0; }
  .d1 .id { font-size: 13px; color: var(--fg); font-weight: 700; }
  .d1 .tool { font-size: 11px; color: var(--mu); }
  .d1 .stamp { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
  .d1 .cmd { font-size: 11px; color: var(--mu); padding-top: 2px; }
  .d1 .cmd::before { content: "$ "; color: var(--ac); }
  .d1 .meta { font-size: 10px; color: var(--mu); font-variant-numeric: tabular-nums; }
  .d1 .sep { border-top: 1px dashed var(--bd); margin: 6px 0; }

  /* ============ D2 · HAIRLINE 发丝 ============ */
  .d2 .card { display: flex; gap: 12px; padding: 2px 0 2px 0; }
  .d2 .rail { width: 2px; border-radius: 1px; align-self: stretch; }
  .d2 .body { flex: 1; min-width: 0; }
  .d2 .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .d2 .id { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--fg); }
  .d2 .state { font-size: 9.5px; font-weight: 700; letter-spacing: 1.8px; }
  .d2 .sub { font-family: var(--mono); font-size: 11px; color: var(--mu); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d2 .meta { font-size: 10px; color: var(--mu); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .d2 .group { background: var(--s1); border-radius: 10px; padding: 12px 14px; }
  .d2 .group .card + .card { border-top: 1px solid var(--bd); padding-top: 10px; margin-top: 10px; }
  .d2 .ghead { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }

  /* ============ D3 · HERO TINT 状态染色 ============ */
  .d3 .card { border-radius: 10px; overflow: hidden; border: 1px solid var(--bd); background: var(--s1); }
  .d3 .band { padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bd); }
  .d3 .band.running { background: color-mix(in srgb, var(--ac) 12%, transparent); }
  .d3 .band.completed { background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .d3 .band.failed { background: color-mix(in srgb, var(--er) 12%, transparent); }
  .d3 .band .t { font-size: 10px; font-weight: 700; letter-spacing: 1.8px; }
  .d3 .band .pill { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #fff; padding: 3px 9px; border-radius: 999px; }
  .dark .d3 .band .pill { color: #101214; }
  .d3 .cbody { padding: 10px 12px 12px; }
  .d3 .id { font-family: var(--mono); font-size: 13.5px; font-weight: 700; color: var(--fg); }
  .d3 .tool { font-size: 11px; color: var(--mu); margin-left: 6px; }
  .d3 .cmd { font-family: var(--mono); font-size: 11px; color: var(--mu); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d3 .meta { font-size: 10px; color: var(--mu); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .d3 .multi .cbody + .cbody { border-top: 1px solid var(--bd); }
  .d3 .multi .band { border-bottom: 1px solid var(--bd); }

  /* ============ D4 · CONSOLE 控制台 ============ */
  .d4 .card { background: var(--s1); border: 1px solid var(--bd); border-radius: 8px; padding: 4px 0; }
  .d4 .head { display: flex; justify-content: space-between; padding: 7px 12px; }
  .d4 .row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-top: 1px solid var(--bd); }
  .d4 .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .d4 .id { font-family: var(--mono); font-size: 12px; color: var(--fg); font-weight: 600; }
  .d4 .tool { font-size: 10.5px; color: var(--mu); }
  .d4 .grow { flex: 1; min-width: 0; font-family: var(--mono); font-size: 10.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d4 .time { font-size: 10.5px; color: var(--mu); font-variant-numeric: tabular-nums; }
  .d4 .chip { font-family: var(--mono); font-size: 9.5px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--bd); }
  .d4 .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ac); }

  /* ============ D5 · SOFT TILE 浮层瓷贴 ============ */
  .d5 .card { background: var(--s1); border-radius: 14px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.07); }
  .dark .d5 .card { box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35); }
  .d5 .top { display: flex; align-items: center; gap: 10px; }
  .d5 .icon { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
  .d5 .icon.running { background: color-mix(in srgb, var(--ac) 15%, transparent); color: var(--ac); }
  .d5 .icon.completed { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .d5 .icon.failed { background: color-mix(in srgb, var(--er) 15%, transparent); color: var(--er); }
  .d5 .ttl { flex: 1; min-width: 0; }
  .d5 .ttl .id { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--fg); }
  .d5 .ttl .sub { font-size: 10.5px; color: var(--mu); margin-top: 1px; }
  .d5 .pill { font-size: 9.5px; font-weight: 700; letter-spacing: .8px; padding: 3px 9px; border-radius: 999px; }
  .d5 .pill.running { background: color-mix(in srgb, var(--ac) 15%, transparent); color: var(--ac); }
  .d5 .pill.completed { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .d5 .pill.failed { background: color-mix(in srgb, var(--er) 15%, transparent); color: var(--er); }
  .d5 .cmd { margin-top: 10px; background: var(--s2); border-radius: 8px; padding: 7px 9px; font-family: var(--mono); font-size: 10.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d5 .foot { margin-top: 8px; display: flex; justify-content: space-between; font-size: 10px; color: var(--mu); font-variant-numeric: tabular-nums; }
  .d5 .divider { border-top: 1px solid var(--bd); margin: 10px 0; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const RUNNING = { id:"mt_9cec89b4", tool:"bash", state:"running", cmd:"npm test -- --watch", time:"45s", live:true };
const DONE    = { id:"mt_a1b2c3d4", tool:"bash", state:"completed", cmd:"sleep 45 && echo done", time:"45s", exit:"exit 0" };
const FAILED  = { id:"mt_deadbeef", tool:"web_fetch", state:"failed", cmd:"curl https://api.example.com/v2/very/long/endpoint/that/overflows", time:"3s", exit:"exit 1" };

const cols = [["light","LIGHT"],["dark","DARK"]];
const dirs = ["d1","d2","d3","d4","d5"];
const names = { d1:"D1 · Receipt 回执", d2:"D2 · Hairline 发丝", d3:"D3 · Hero Tint 状态染色", d4:"D4 · Console 控制台", d5:"D5 · Soft Tile 浮层瓷贴" };

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function card(d, t, opts={}){
  const st = t.state;
  switch(d){
    case "d1": return `
      <div class="card">
        ${opts.plain?"":`<div class="head"><span class="t">MEANTIME${opts.action?" · "+opts.action.toUpperCase():""}</span>${t.live?`<span class="live">● LIVE</span>`:""}</div>`}
        <div class="row"><span><span class="id">${t.id}</span> <span class="tool">${t.tool}</span></span>
        <span class="stamp st-${st}">[ ${st.toUpperCase()} ]</span></div>
        <div class="cmd">${esc(t.cmd)}</div>
        <div class="row" style="padding-bottom:0"><span class="meta">${t.time}</span><span class="meta">${t.exit??""}</span></div>
      </div>`;
    case "d2": return `
      <div class="card">
        <div class="rail bg-${st}"></div>
        <div class="body">
          <div class="l1"><span class="id">${t.id}</span><span class="state st-${st}">${st.toUpperCase()}${t.live?" ●":""}</span></div>
          <div class="sub">${esc(t.cmd)}</div>
          <div class="meta">${t.tool} · ${t.time}${t.exit?" · "+t.exit:""}</div>
        </div>
      </div>`;
    case "d3":
      if (opts.multi) return `
        <div class="card multi">
          <div class="band ${st}"><span class="t st-${st}">MEANTIME · LIST</span><span class="pill bg-${st}">${st.toUpperCase()}</span></div>
          ${opts.multi.map(x=>`
            <div class="cbody">
              <span class="id">${x.id}</span><span class="tool">${x.tool}</span>
              <span style="float:right" class="st-${x.state}" ><b style="font-size:10px;letter-spacing:1px">${x.state.toUpperCase()}</b></span>
              <div class="cmd">${esc(x.cmd)}</div>
              <div class="meta">${x.time}${x.exit?" · "+x.exit:""}</div>
            </div>`).join("")}
        </div>`;
      return `
        <div class="card">
          <div class="band ${st}"><span class="t st-${st}">${opts.action?("MEANTIME · "+opts.action.toUpperCase()):"BACKGROUND TASK"}</span><span class="pill bg-${st}">${st.toUpperCase()}${t.live?" · LIVE":""}</span></div>
          <div class="cbody">
            <span class="id">${t.id}</span><span class="tool">${t.tool}</span>
            <div class="cmd">${esc(t.cmd)}</div>
            <div class="meta">${t.time}${t.exit?" · "+t.exit:""}</div>
          </div>
        </div>`;
    case "d4": return `
      <div class="card">
        ${opts.plain?"":`<div class="head"><span class="caps">MEANTIME${opts.action?" · "+opts.action.toUpperCase():""}</span>${t.live?`<span class="live-dot"></span>`:""}</div>`}
        <div class="row" style="${opts.plain?"border-top:none":""}">
          <span class="dot bg-${st}"></span>
          <span class="id">${t.id}</span>
          <span class="tool">${t.tool}</span>
          <span class="grow">${esc(t.cmd)}</span>
          <span class="time">${t.time}</span>
          <span class="chip st-${st}">${t.exit ?? st.toUpperCase()}</span>
        </div>
      </div>`;
    case "d5": {
      const icon = st==="completed"?"✓":st==="failed"?"✕":"▶";
      return `
      <div class="card">
        <div class="top">
          <div class="icon ${st}">${icon}</div>
          <div class="ttl"><div class="id">${t.id}</div><div class="sub">${t.tool} · ${t.time}</div></div>
          <span class="pill ${st}">${st.toUpperCase()}${t.live?" · LIVE":""}</span>
        </div>
        <div class="cmd">${esc(t.cmd)}</div>
        ${t.exit?`<div class="foot"><span>${opts.action??"background task"}</span><span>${t.exit}</span></div>`:`<div class="foot"><span>${opts.action??"background task"}</span><span></span></div>`}
      </div>`;
    }
  }
}

function group(d){
  // list card: three tasks
  const list = [RUNNING, DONE, FAILED];
  if (d==="d1") return `<div class="card"><div class="head"><span class="t">MEANTIME · LIST</span></div>${list.map((t,i)=>`${i?'<div class="sep"></div>':""}
      <div class="row"><span><span class="id">${t.id}</span> <span class="tool">${t.tool}</span></span><span class="stamp st-${t.state}">[ ${t.state.toUpperCase()} ]</span></div>
      <div class="cmd">${esc(t.cmd)}</div>`).join("")}</div>`;
  if (d==="d2") return `<div class="group"><div class="ghead"><span class="caps">MEANTIME · LIST</span><span class="caps">3</span></div>${list.map(t=>card("d2",t)).join("")}</div>`;
  if (d==="d3") return card("d3", RUNNING, { multi: list });
  if (d==="d4") return `<div class="card"><div class="head"><span class="caps">MEANTIME · LIST</span><span class="caps">3</span></div>${list.map(t=>card("d4",t,{plain:true})).join("")}</div>`;
  if (d==="d5") return `<div class="card">${list.map((t,i)=>`${i?'<div class="divider"></div>':""}
      <div class="top">
        <div class="icon ${t.state}">${t.state==="completed"?"✓":t.state==="failed"?"✕":"▶"}</div>
        <div class="ttl"><div class="id">${t.id}</div><div class="sub">${t.tool} · ${t.time}${t.exit?" · "+t.exit:""}</div></div>
        <span class="pill ${t.state}">${t.state.toUpperCase()}</span>
      </div>`).join("")}</div>`;
}

const sheet = document.getElementById("sheet");
for (const [cls,label] of cols){
  const col = document.createElement("div");
  col.className = "col " + cls;
  col.innerHTML = `<div class="theme-tag">${label}</div>` + dirs.map(d=>`
    <div class="dir ${d}">
      <div class="dir-tag">${names[d].split("·")[0].trim()}</div>
      <div class="dir-name">${names[d].split("·")[1].trim()}</div>
      <div class="stack">
        ${card(d, RUNNING, {action:"bash"})}
        ${card(d, DONE, {action:"completion"})}
        ${group(d)}
      </div>
    </div>`).join("");
  sheet.appendChild(col);
}
</script>
</body>
</html>
