<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime · v18 · G redux</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font: 12px -apple-system, "SF Pro Text", sans-serif; padding: 24px; color: #e4e7ec; }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .intro { color: #899097; font-size: 12px; margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: repeat(3, 390px); gap: 22px; align-items: start; }
  .col > .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .col > .sub { color: #899097; font-size: 11px; margin-bottom: 12px; min-height: 44px; }
  .cell { margin-bottom: 14px; }
  .cell .lab { color: #5c6167; font-size: 10px; letter-spacing: .5px; margin-bottom: 4px; }
  .chat { background: #0f1114; border-radius: 10px; padding: 12px 16px; }
  .m { font-family: Menlo, ui-monospace, monospace; font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; }
  .pre { white-space: pre-wrap; word-break: break-all; }
  .out { color: #9aa0a8; }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .grow { flex: 1; min-width: 0; }
  .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { flex: none; color: #899097; display: flex; gap: 8px; }
  .chev { color: #3f434a; }
  .foot { font-size: 11px; line-height: 16px; color: #5c6167; }

  /* G redux 共有骨架：整卡状态色染色 + 大水印，无其他风格元素 */
  .g { position: relative; overflow: hidden; border-radius: 8px; padding: 10px 14px 12px; }
  .g.ok  { --c:127,178,106; background: linear-gradient(135deg, rgba(127,178,106,.15), rgba(127,178,106,.02) 65%); border: 1px solid rgba(127,178,106,.34); }
  .g.bad { --c:239,125,107; background: linear-gradient(135deg, rgba(239,125,107,.15), rgba(239,125,107,.02) 65%); border: 1px solid rgba(239,125,107,.38); }
  .g.run { --c:233,180,90;  background: linear-gradient(135deg, rgba(233,180,90,.13), rgba(233,180,90,.02) 65%); border: 1px solid rgba(233,180,90,.34); }
  .g .cmdl { font-size: 14px; line-height: 20px; font-weight: 700; color: #f2f4f7; }
  .g .body { margin-top: 5px; position: relative; } .g .foot { margin-top: 6px; position: relative; }
  .g .wm { position: absolute; pointer-events: none; font-weight: 900; font-family: -apple-system, sans-serif; }

  /* W1 · 右上实心水印，内容让出右 22% */
  .W1 .wm { right: -10px; top: -6px; font-size: 88px; line-height: 1; letter-spacing: -5px; color: rgba(var(--c),.10); }
  .W1 .cmdl, .W1 .body, .W1 .foot { max-width: 78%; }
  /* W2 · 底带描边水印（独立区域，与输出分层） */
  .W2 .wm { right: -6px; bottom: -12px; font-size: 58px; line-height: 1; letter-spacing: -3px; color: transparent; -webkit-text-stroke: 1.2px rgba(var(--c),.30); }
  .W2 .zone { position: relative; height: 42px; margin-top: 6px; }
  .W2 .zone .foot { position: absolute; left: 0; bottom: 4px; margin-top: 0; }
  /* W3 · 左色条 + 右侧竖排水印（内缩不被裁） */
  .W3 { padding-left: 22px; padding-right: 46px; }
  .W3 .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: rgb(var(--c)); border-radius: 8px 0 0 8px; }
  .W3 .wm { right: 8px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; font-size: 26px; letter-spacing: 6px; color: rgba(var(--c),.30); }
</style>
</head>
<body>
<h1>v18 · G 变体重写（无 EVA）</h1>
<div class="intro">整卡状态色染色 + 大水印，Paseo 主题色。水印一律不压输出：W1 内容让位 / W2 独立底带 / W3 竖排内缩。</div>
<div class="grid" id="grid"></div>
<script>
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const cases = [
 {lab:"短命令 · 收起", cmd:"npm test", st:"ok", t:"00:45", open:false, out:"ℹ fail 0\nℹ duration_ms 336.6"},
 {lab:"短命令 · 展开", cmd:"npm test", st:"ok", t:"00:45", open:true, out:"ℹ tests 25\nℹ suites 7\nℹ pass 25\nℹ fail 0\nℹ duration_ms 336.6", foot:"mt_9cec1234 · 19:31:28 → 19:32:13"},
 {lab:"长单行 · 展开", cmd:"rg -n --hidden -g '!node_modules' \"outputPath|outputTail\" plugins/paseo/client plugins/paseo/shared src", st:"ok", t:"00:01", open:true, out:"client/task-view.tsx:66:  const source = live ? task.outputTail\nshared/tasks.ts:41:  outputPath?: string;", foot:"mt_51ab07e2 · 19:40:02 → 19:40:03"},
 {lab:"多行失败 · 展开", cmd:"for f in test/*.test.ts; do\n  node --test \"$f\" || exit 1\ndone", st:"bad", t:"00:12", word:"exit 1", open:true, out:"✔ board renders (4ms)\n✖ drawer shows command once\n  AssertionError: 2 !== 1", foot:"mt_77d0c9aa · 19:44:10 → 19:44:22"},
 {lab:"运行中 · 收起", cmd:"npm run build -- --watch", st:"run", t:"02:13", open:false, out:"[watch] build started\n  dist/client.js  41.2kb\n  dist/server.js  12.8kb\n[watch] build finished\n[watch] waiting for changes…"},
];
const flat = cmd => cmd.replace(/\s+/g," ");
const meta = c => `<span class="meta">${c.word?`<span style="color:#ef7d6b">${c.word}</span>`:`<span>${c.t}</span>`}<span class="chev">${c.open?"⌃":"⌄"}</span></span>`;
const outText = c => esc(c.open ? c.out : c.out.split("\n").slice(c.st==="run"?-5:-2).join("\n"));
const W = c => c.st==="ok"?"PASS":c.st==="bad"?"FAIL":"LIVE";
const cmdH = c => c.open?esc(c.cmd):esc(flat(c.cmd));
const head = c => `<div class="row"><div class="grow cmdl ${c.open?"pre":"clip"}">${cmdH(c)}</div>${meta(c)}</div>`;
const body = c => `<div class="body pre out">${outText(c)}</div>`;
const styles = {
 W1:{title:"W1 · 右上实心水印",sub:"大字实心压右上，内容区只占左 78%，水印永远不碰文字。最近 v14-G 原版。",r:c=>`<div class="g W1 ${c.st} m"><div class="wm">${W(c)}</div>${head(c)}${body(c)}${c.open?`<div class="foot">${c.foot}</div>`:""}</div>`},
 W2:{title:"W2 · 底带描边水印",sub:"空心描边大字独占卡片底部一条区域，和输出完全分层。收起时也有这条底带，卡会高一点。",r:c=>`<div class="g W2 ${c.st} m">${head(c)}${body(c)}<div class="zone"><div class="wm">${W(c)}</div>${c.open?`<div class="foot">${c.foot}</div>`:""}</div></div>`},
 W3:{title:"W3 · 左色条 + 竖排水印",sub:"左边整条状态色竖条，状态词竖排在右缘内侧。最收敛，水印永不遮字。",r:c=>`<div class="g W3 ${c.st} m"><div class="rail"></div><div class="wm">${W(c)}</div>${head(c)}${body(c)}${c.open?`<div class="foot">${c.foot}</div>`:""}</div>`},
};
document.getElementById("grid").innerHTML = Object.values(styles).map(s=>`<div class="col"><div class="title">${s.title}</div><div class="sub">${s.sub}</div>${
  cases.map(c=>`<div class="cell"><div class="lab">${c.lab}</div><div class="chat">${s.r(c)}</div></div>`).join("")}</div>`).join("");
</script>
</body>
</html>
