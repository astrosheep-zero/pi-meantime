<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime card · v6 seven consoles</title>
<style>
  :root { --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, "SF Pro Text", sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: #555; -webkit-font-smoothing: antialiased; }
  .sheet { display: flex; align-items: flex-start; }
  .col { width: 390px; flex: none; padding: 30px 24px 60px; }
  /* ink rgb, surface, hot (running), bad (failed) */
  .light { --ink: 22,24,28; --bg: #ffffff; --hot: #b7791f; --bad: #c2412d; --live: #2f8a55; background: var(--bg); }
  .dark  { --ink: 228,231,236; --bg: #0f1114; --hot: #e9b45a; --bad: #ef7d6b; --live: #6fcf97; background: var(--bg); }
  .tag { font: 600 8px/1 var(--mono); letter-spacing: 3px; color: rgba(var(--ink),.3); margin-bottom: 26px; }
  .dir { margin-bottom: 44px; }
  .dn { font-size: 12.5px; font-weight: 600; color: rgb(var(--ink)); }
  .dn i { font-style: normal; font-weight: 400; color: rgba(var(--ink),.38); margin-left: 6px; }
  .stack { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .m { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .a1 { color: rgb(var(--ink)); } .a2 { color: rgba(var(--ink),.62); } .a3 { color: rgba(var(--ink),.4); } .a4 { color: rgba(var(--ink),.24); }
  .hot { color: var(--hot); } .bad { color: var(--bad); }
  .el { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @keyframes blink { 50% { opacity: 0; } }
  .cur { animation: blink 1.1s steps(1) infinite; }

  /* 1 TTY — no box. one hairline on the left, the chat background shows through */
  .tty { border-left: 1px solid rgba(var(--ink),.16); padding: 1px 0 1px 10px; font-size: 11px; line-height: 1.55; }
  .tty.run { border-left-color: var(--hot); }
  .tty.fail { border-left-color: var(--bad); }
  .tty .l2 { font-size: 9.5px; display: flex; gap: 8px; }

  /* 2 STATUSLINE — tmux/vim bar, one line, segments separated by thin rules */
  .sl { display: flex; align-items: stretch; height: 22px; border-radius: 3px; overflow: hidden; font-size: 10px; background: rgba(var(--ink),.045); box-shadow: inset 0 0 0 .5px rgba(var(--ink),.12); }
  .sl > span { display: flex; align-items: center; padding: 0 8px; white-space: nowrap; }
  .sl > span + span { box-shadow: inset .5px 0 0 rgba(var(--ink),.12); }
  .sl .mode { font-weight: 600; letter-spacing: 1px; font-size: 8.5px; }
  .sl.run .mode { background: var(--hot); color: var(--bg); }
  .sl.fail .mode { background: var(--bad); color: var(--bg); }
  .sl .cmd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 22px; }

  /* 3 READOUT — instrument: tiny caps labels over figures, top+bottom rules only */
  .ro { border-top: 1px solid rgba(var(--ink),.5); border-bottom: .5px solid rgba(var(--ink),.14); padding: 6px 0 7px; display: grid; grid-template-columns: minmax(0,1fr) auto auto; column-gap: 16px; }
  .ro .k { font: 500 7px/1 var(--mono); letter-spacing: 1.6px; color: rgba(var(--ink),.36); margin-bottom: 4px; }
  .ro .v { font-size: 11px; }
  .ro .n { font-size: 15px; font-weight: 300; letter-spacing: -.3px; line-height: 1; font-family: var(--sans); font-variant-numeric: tabular-nums; }

  /* 4 LOG TAIL — the last lines of a log; previous lines fade upward */
  .lg { font-size: 10px; line-height: 1.6; }
  .lg .row { display: grid; grid-template-columns: 7ch minmax(0,1fr) auto; column-gap: 10px; }
  .lg .row:nth-child(1) { opacity: .28; } .lg .row:nth-child(2) { opacity: .55; }

  /* 5 GLASS — a small dark slab, half-pixel edge, no scanlines, no glow */
  .gl { background: #0b0d10; border-radius: 6px; padding: 7px 10px 8px; font-size: 10.5px; line-height: 1.5; box-shadow: 0 0 0 .5px rgba(255,255,255,.09), 0 1px 0 rgba(255,255,255,.04) inset; --g1:#e8ece9; --g2:#8f9893; --g3:#565e59; }
  .gl .t { display: flex; justify-content: space-between; font-size: 8px; letter-spacing: 1.4px; color: var(--g3); margin-bottom: 3px; }
  .gl .c { color: var(--g1); } .gl .s { color: var(--g2); font-size: 9.5px; display: flex; gap: 10px; }
  .gl .hot { color: #e9b45a; } .gl .bad { color: #ef7d6b; }

  /* 6 HTOP METER — braille spinner + character meter, process-monitor diction */
  .ht { font-size: 10px; line-height: 1.6; }
  .ht .bar { letter-spacing: -1px; }
  .ht .row { display: grid; grid-template-columns: 1.5ch minmax(0,1fr) auto; column-gap: 8px; }

  /* 7 MANPAGE — terminal typesetting: bold name, indented body, a section header */
  .mp { font-size: 10.5px; line-height: 1.55; }
  .mp .h { font-weight: 700; font-size: 9px; letter-spacing: .5px; }
  .mp .b { padding-left: 4ch; }
  .mp .b b { font-weight: 650; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const RUN = { id:"mt_9cec89b4", tool:"bash", state:"running", cmd:"npm test -- --watch", time:"00:45", at:"15:04:12" };
const OK  = { id:"mt_a1b2c3d4", tool:"bash", state:"completed", cmd:"sleep 45 && echo done", time:"00:45", exit:0, at:"15:03:27" };
const BAD = { id:"mt_deadbeef", tool:"web_fetch", state:"failed", cmd:"curl https://api.example.com/v2/endpoint", time:"00:03", exit:1, at:"15:02:51" };
const ALL = [RUN, OK, BAD];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const st = t => t.state==="running" ? `<span class="hot">running</span>` : t.state==="failed" ? `<span class="bad">exit ${t.exit}</span>` : `<span class="a3">exit ${t.exit}</span>`;
const cls = t => t.state==="running" ? "run" : t.state==="failed" ? "fail" : "ok";
const cur = t => t.state==="running" ? ` <span class="hot cur">▍</span>` : "";

const D = [
  ["TTY", "无框 · 一根发丝", t => `<div class="tty m ${cls(t)}">
      <div class="a1 el">${esc(t.cmd)}${cur(t)}</div>
      <div class="l2"><span class="a3">${t.id}</span><span class="a4">${t.tool}</span><span style="flex:1"></span><span class="a2">${t.time}</span>${st(t)}</div></div>`,
    () => `<div class="tty m">${ALL.map(t=>`<div style="display:flex;gap:10px"><span class="a1 el" style="flex:1">${esc(t.cmd)}</span><span class="a3">${t.time}</span><span style="width:7ch;text-align:right">${st(t)}</span></div>`).join("")}</div>`],

  ["Statusline", "tmux 状态栏 · 单行", t => `<div class="sl m ${cls(t)}">
      <span class="mode a3">${t.state==="running"?"RUN":t.state==="failed"?"ERR":"DONE"}</span>
      <span class="cmd a1">${esc(t.cmd)}</span>
      <span class="a3">${t.id.slice(3)}</span><span class="a2">${t.time}</span></div>`,
    () => `<div style="display:flex;flex-direction:column;gap:3px">${ALL.map(t=>D[1][2](t)).join("")}</div>`],

  ["Readout", "仪器读数 · 上粗下细两根线", t => `<div class="ro">
      <div style="min-width:0"><div class="k">${t.tool.toUpperCase()} · ${t.id}</div><div class="v m a1 el">${esc(t.cmd)}${cur(t)}</div></div>
      <div><div class="k">ELAPSED</div><div class="n a1">${t.time}</div></div>
      <div style="text-align:right"><div class="k">${t.state==="running"?"STATE":"EXIT"}</div><div class="n">${t.state==="running"?`<span class="hot">●</span>`:t.state==="failed"?`<span class="bad">${t.exit}</span>`:`<span class="a3">${t.exit}</span>`}</div></div></div>`,
    () => ALL.map(t=>D[2][2](t)).join("").replace(/class="ro"/g,'class="ro" style="border-top-width:.5px;border-top-color:rgba(var(--ink),.14)"').replace('style="border-top-width:.5px;border-top-color:rgba(var(--ink),.14)"','')],

  ["Log tail", "日志尾巴 · 前文渐隐", t => `<div class="lg m">
      <div class="row"><span class="a3">${t.at}</span><span class="a2 el">spawn ${t.tool} ${t.id}</span><span></span></div>
      <div class="row"><span class="a3">${t.at}</span><span class="a2 el">› ${esc(t.cmd)}</span><span></span></div>
      <div class="row"><span class="a3">+${t.time}</span><span class="a1 el">${t.state==="running"?"waiting":t.state==="failed"?"process failed":"process exited"}${cur(t)}</span>${st(t)}</div></div>`,
    () => `<div class="lg m">${ALL.map(t=>`<div class="row" style="opacity:1"><span class="a3">${t.at.slice(0,5)}</span><span class="a1 el">${esc(t.cmd)}</span>${st(t)}</div>`).join("")}</div>`],

  ["Glass", "小黑片 · 半像素边", t => `<div class="gl m">
      <div class="t"><span>${t.tool} — ${t.id}</span><span>${t.state==="running"?`<span class="hot">●</span> live`:""}</span></div>
      <div class="c el">${esc(t.cmd)}${cur(t)}</div>
      <div class="s"><span>${t.time}</span>${t.state==="running"?`<span class="hot">running</span>`:t.state==="failed"?`<span class="bad">exit ${t.exit}</span>`:`<span>exit ${t.exit}</span>`}</div></div>`,
    () => `<div class="gl m">${ALL.map(t=>`<div style="display:flex;gap:10px"><span class="c el" style="flex:1">${esc(t.cmd)}</span><span class="s">${t.time}</span><span style="width:6ch;text-align:right" class="s">${t.state==="running"?`<span class="hot">run</span>`:t.state==="failed"?`<span class="bad">exit ${t.exit}</span>`:`exit 0`}</span></div>`).join("")}</div>`],

  ["htop", "进程监视器 · 字符仪表", t => `<div class="ht m">
      <div class="row"><span class="${t.state==="running"?"hot":t.state==="failed"?"bad":"a3"}">${t.state==="running"?"⠹":t.state==="failed"?"✕":"✓"}</span><span class="a1 el">${esc(t.cmd)}</span><span class="a2">${t.time}</span></div>
      <div class="row"><span></span><span class="a4 bar el">${t.state==="running"?'<span class="hot">││││││││││││</span>││││││││││││││││││':'││││││││││││││││││││││││││││││'}</span>${st(t)}</div></div>`,
    () => `<div class="ht m">${ALL.map(t=>`<div class="row"><span class="${t.state==="running"?"hot":t.state==="failed"?"bad":"a3"}">${t.state==="running"?"⠹":t.state==="failed"?"✕":"✓"}</span><span class="a1 el">${esc(t.cmd)}</span><span class="a3">${t.time}</span></div>`).join("")}</div>`],

  ["Manpage", "man 排版 · 缩进即层级", t => `<div class="mp m">
      <div class="h a2">${t.tool.toUpperCase()}(${t.id.slice(3,7)})</div>
      <div class="b a1 el"><b>${esc(t.cmd.split(" ")[0])}</b> ${esc(t.cmd.split(" ").slice(1).join(" "))}${cur(t)}</div>
      <div class="b a3">${t.time} elapsed, ${st(t)}</div></div>`,
    () => `<div class="mp m"><div class="h a2">PROCESSES</div>${ALL.map(t=>`<div class="b" style="display:flex;gap:10px"><span class="a1 el" style="flex:1"><b>${esc(t.cmd.split(" ")[0])}</b> ${esc(t.cmd.split(" ").slice(1).join(" "))}</span>${st(t)}</div>`).join("")}</div>`],
];

const sheet = document.getElementById("sheet");
for (const theme of ["light","dark"]) {
  const col = document.createElement("div");
  col.className = "col " + theme;
  col.innerHTML = `<div class="tag">${theme.toUpperCase()} · 390PT</div>` + D.map(([en,cn,one,many],i)=>`
    <div class="dir"><div class="dn">${i+1} · ${en}<i>${cn}</i></div>
      <div class="stack">${one(RUN)}${one(OK)}${one(BAD)}${many()}</div></div>`).join("");
  sheet.appendChild(col);
}
</script>
</body>
</html>
