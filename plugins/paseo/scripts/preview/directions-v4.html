<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime card · v4 postmodern console</title>
<style>
  :root { --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: #555; }
  .sheet { display: flex; align-items: flex-start; }
  .col { width: 400px; flex: none; padding: 34px 30px 70px; }
  .col.light { --ink:24,27,31; --s0:#ffffff; --s1:#f4f5f7; background: var(--s0); }
  .col.dark  { --ink:233,236,240; --s0:#0e1013; --s1:#171a1e; background: var(--s0); }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }
  .theme-tag { font-size: 9px; letter-spacing: 3px; color: rgba(var(--ink),.35); margin-bottom: 30px; }
  .dir { margin-bottom: 64px; }
  .dir-name { font-size: 15px; font-weight: 700; color: rgb(var(--ink)); margin-bottom: 3px; }
  .dir-cn { font-size: 12px; color: rgba(var(--ink),.35); margin-bottom: 26px; }
  .stack { display: flex; flex-direction: column; gap: 26px; }

  /* ============ K1 · CRT 磷光终端 (console stays dark in both themes) ============ */
  .k1 .crt {
    background: #0b0f0b; border-radius: 6px; padding: 12px 14px;
    border: 1px solid rgba(120,220,140,.14);
    box-shadow: inset 0 0 24px rgba(60,200,110,.05);
    font-family: var(--mono); font-size: 11.5px; line-height: 1.9;
    color: #7fb389;
    /* scanlines: preview flourish; RN fallback = zebra rows below */
    background-image: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.16) 2px 3px);
  }
  .k1 .head { display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: 2px; color: #4d7057; margin-bottom: 4px; }
  .k1 .live { color: #ffd479; }
  .k1 .ln { display: flex; gap: 8px; align-items: baseline; }
  .k1 .pr { color: #4d7057; flex: none; }
  .k1 .cmd { color: #c4e8cd; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k1 .sub { color: #527a5d; font-size: 10px; display: flex; justify-content: space-between; }
  .k1 .st-ok { color: #8fd49b; } .k1 .st-run { color: #ffd479; text-shadow: 0 0 8px rgba(255,212,121,.35); }
  .k1 .st-er { color: #ff7a6b; text-shadow: 0 0 8px rgba(255,122,107,.3); }
  .k1 .cursor { color: #ffd479; }
  .k1 .zebra { background: rgba(140,220,160,.05); border-radius: 3px; }
  .k1 .sep { color: #2c4534; user-select: none; letter-spacing: -2px; overflow: hidden; white-space: nowrap; }

  /* ============ K2 · GREENBAR 行式打印纸 ============ */
  .k2 .paper {
    background: #fbfdf6; border: 1px solid rgba(60,90,60,.18); border-radius: 3px;
    border-left: none; border-right: none;
    font-family: var(--mono); color: #2b4632; font-size: 11px; line-height: 2.0;
    position: relative;
  }
  .dark .k2 .paper { background: #121812; color: #9cc4a4; border-color: rgba(140,200,150,.16); }
  .k2 .paper::before, .k2 .paper::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 14px;
    background-image: radial-gradient(circle 3px, rgba(90,130,90,.35) 2.6px, transparent 3px);
    background-size: 14px 26px; background-position: center; background-repeat: repeat-y;
  }
  .dark .k2 .paper::before, .dark .k2 .paper::after { background-image: radial-gradient(circle 3px, rgba(140,200,150,.22) 2.6px, transparent 3px); }
  .k2 .paper::before { left: 0; border-right: 1px dashed rgba(90,130,90,.25); }
  .k2 .paper::after { right: 0; border-left: 1px dashed rgba(90,130,90,.25); }
  .k2 .inner { padding: 10px 26px; }
  .k2 .head { font-size: 9px; letter-spacing: 2.6px; color: rgba(70,105,75,.7); display: flex; justify-content: space-between; margin-bottom: 3px; }
  .dark .k2 .head { color: rgba(140,190,150,.55); }
  .k2 .row { display: flex; align-items: baseline; gap: 6px; padding: 0 6px; }
  .k2 .zebra { background: rgba(110,160,110,.10); border-radius: 2px; }
  .dark .k2 .zebra { background: rgba(140,200,150,.08); }
  .k2 .cmd { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k2 .leader { flex: 1; min-width: 12px; border-bottom: 2px dotted rgba(70,105,75,.4); transform: translateY(-3px); }
  .dark .k2 .leader { border-color: rgba(140,190,150,.3); }
  .k2 .st { font-weight: 700; white-space: nowrap; }
  .k2 .st.ok { color: inherit; opacity: .65; } .k2 .st.run { color: #1d7a38; } .k2 .st.er { color: #b03030; }
  .dark .k2 .st.run { color: #7fd489; } .dark .k2 .st.er { color: #e08080; }
  .k2 .meta { font-size: 9.5px; opacity: .6; padding: 0 6px; }

  /* ============ K3 · HARDWARE 硬件仪器 ============ */
  .k3 .box {
    border: 2px solid rgb(var(--ink)); border-radius: 2px;
    box-shadow: 5px 5px 0 rgba(var(--ink),.92);
    font-family: var(--mono); color: rgb(var(--ink));
    background: var(--s0);
  }
  .k3 .head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 2px solid rgb(var(--ink)); }
  .k3 .head .t { font-size: 9px; font-weight: 800; letter-spacing: 2.4px; }
  .k3 .flag { font-size: 9px; font-weight: 800; letter-spacing: 1.8px; background: rgb(var(--ink)); color: var(--s0); padding: 2.5px 8px; }
  .k3 .flag.er { background: #c03434; color: #fff; }
  .dark .k3 .flag.er { background: #e08585; color: #12141a; }
  .k3 .flag.run { background: #3d53d9; color: #fff; }
  .dark .k3 .flag.run { background: #98a8f2; color: #12141a; }
  .k3 .body { padding: 10px 12px 11px; }
  .k3 .cmd { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k3 .grid { display: flex; margin-top: 9px; border-top: 1.5px solid rgba(var(--ink),.35); }
  .k3 .cell { flex: 1; padding: 6px 0 0; }
  .k3 .cell + .cell { border-left: 1.5px solid rgba(var(--ink),.35); padding-left: 10px; }
  .k3 .k { font-size: 8px; font-weight: 800; letter-spacing: 2px; opacity: .55; }
  .k3 .v { font-size: 11px; font-weight: 700; margin-top: 2px; }
  .k3 .multi .body { padding: 2px 12px; }
  .k3 .multi .mrow { display: flex; align-items: baseline; gap: 8px; padding: 8px 0; }
  .k3 .multi .mrow + .mrow { border-top: 1.5px solid rgba(var(--ink),.35); }
  .k3 .multi .mc { flex: 1; min-width: 0; font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k3 .multi .mt { font-size: 10px; opacity: .6; }
  .k3 .multi .mflag { font-size: 8px; font-weight: 800; letter-spacing: 1.4px; padding: 2px 6px; background: rgba(var(--ink),.12); }
  .k3 .multi .mflag.er { background: #c03434; color: #fff; }
  .k3 .multi .mflag.run { background: #3d53d9; color: #fff; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const RUN = { id:"mt_9cec89b4", tool:"bash", state:"running", cmd:"npm test -- --watch", time:"00:45", exit:null };
const OK  = { id:"mt_a1b2c3d4", tool:"bash", state:"completed", cmd:"sleep 45 && echo done", time:"00:45", exit:"E0" };
const BAD = { id:"mt_deadbeef", tool:"web_fetch", state:"failed", cmd:"curl https://api.example.com/v2/endpoint", time:"00:03", exit:"E1" };
const LIST = [RUN, OK, BAD];
const names = { k1:["CRT","磷光终端"], k2:["Greenbar","行式打印纸"], k3:["Hardware","硬件仪器"] };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const SEP = "─".repeat(64);

function card(d, t, head){
  if (d==="k1") {
    const stCls = t.state==="running"?"st-run":t.state==="failed"?"st-er":"st-ok";
    const stTxt = t.state==="running"?`RUNNING <span class="cursor">▉</span>`:t.state==="failed"?`FAILED ${t.exit??""}`:`EXIT ${t.exit?.slice(1)??"0"}`;
    return `<div class="crt">
      <div class="head"><span>MEANTIME ── ${head ?? "TTY"}</span>${t.state==="running"?`<span class="live">● REC</span>`:""}</div>
      <div class="ln zebra"><span class="pr">›</span><span class="cmd">${esc(t.cmd)}</span></div>
      <div class="sub"><span>${t.id} · ${t.tool} · T+${t.time}</span><span class="${stCls}">${stTxt}</span></div>
    </div>`;
  }
  if (d==="k2") {
    const stCls = t.state==="running"?"run":t.state==="failed"?"er":"ok";
    return `<div class="paper"><div class="inner">
      <div class="head"><span>${head ?? "MEANTIME"}</span><span>${t.id.toUpperCase()}</span></div>
      <div class="row zebra"><span class="cmd">${esc(t.cmd)}</span><span class="leader"></span><span class="st ${stCls}">${t.state.toUpperCase()} ${t.exit??""}</span></div>
      <div class="meta">${t.tool} · T+${t.time}</div>
    </div></div>`;
  }
  if (d==="k3") {
    const flCls = t.state==="running"?"run":t.state==="failed"?"er":"";
    return `<div class="box">
      <div class="head"><span class="t">${head ?? "BACKGROUND TASK"}</span><span class="flag ${flCls}">${t.state.toUpperCase()}</span></div>
      <div class="body">
        <div class="cmd">${esc(t.cmd)}</div>
        <div class="grid">
          <div class="cell"><div class="k">NO.</div><div class="v">${t.id.slice(3)}</div></div>
          <div class="cell"><div class="k">ELAPSED</div><div class="v num">${t.time}</div></div>
          <div class="cell"><div class="k">EXIT</div><div class="v num">${t.exit?.slice(1) ?? "—"}</div></div>
        </div>
      </div>
    </div>`;
  }
}
function group(d){
  if (d==="k1") return `<div class="crt"><div class="head"><span>MEANTIME ── LIST</span><span>3 PROCS</span></div>
    ${LIST.map((t,i)=>{
      const stCls = t.state==="running"?"st-run":t.state==="failed"?"st-er":"st-ok";
      const stTxt = t.state==="running"?`RUNNING <span class="cursor">▉</span>`:t.state==="failed"?`FAILED ${t.exit}`:`EXIT ${t.exit.slice(1)}`;
      return `<div class="ln ${i%2?"":"zebra"}"><span class="pr">›</span><span class="cmd">${esc(t.cmd)}</span></div>
      <div class="sub ${i%2?"":"zebra"}"><span>${t.id} · T+${t.time}</span><span class="${stCls}">${stTxt}</span></div>`;
    }).join("")}</div>`;
  if (d==="k2") return `<div class="paper"><div class="inner">
    <div class="head"><span>MEANTIME ─ LIST</span><span>3 TASKS</span></div>
    ${LIST.map((t,i)=>{
      const stCls = t.state==="running"?"run":t.state==="failed"?"er":"ok";
      return `<div class="row ${i%2?"":"zebra"}"><span class="cmd">${esc(t.cmd)}</span><span class="leader"></span><span class="st ${stCls}">${t.state.toUpperCase()} ${t.exit??""}</span></div>
      <div class="meta ${i%2?"":"zebra"}" style="margin-bottom:4px">${t.id} · ${t.tool} · T+${t.time}</div>`;
    }).join("")}</div></div>`;
  if (d==="k3") return `<div class="box multi">
    <div class="head"><span class="t">MEANTIME · LIST</span><span class="flag">3 TASKS</span></div>
    <div class="body">${LIST.map(t=>{
      const flCls = t.state==="running"?"run":t.state==="failed"?"er":"";
      return `<div class="mrow"><span class="mc">${esc(t.cmd)}</span><span class="mt num">${t.time}</span><span class="mflag ${flCls}">${t.state.toUpperCase()}</span></div>`;
    }).join("")}</div></div>`;
}

const sheet = document.getElementById("sheet");
for (const cls of ["light","dark"]){
  const col = document.createElement("div");
  col.className = "col " + cls;
  col.innerHTML = `<div class="theme-tag">${cls.toUpperCase()} · 390PT</div>` + Object.entries(names).map(([d,[en,cn]])=>`
    <div class="dir ${d}">
      <div class="dir-name">${en}</div>
      <div class="dir-cn">${cn}</div>
      <div class="stack">
        ${card(d, RUN, "TTY01")}
        ${card(d, OK, "COMPLETION")}
        ${group(d)}
      </div>
    </div>`).join("");
  sheet.appendChild(col);
}
</script>
</body>
</html>
