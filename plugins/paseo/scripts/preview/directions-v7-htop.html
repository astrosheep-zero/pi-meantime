<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime card · v7 htop ×5 + completion ×5</title>
<style>
  :root { --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, "SF Pro Text", sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: #555; -webkit-font-smoothing: antialiased; }
  .sheet { display: flex; align-items: flex-start; }
  .col { width: 390px; flex: none; padding: 30px 24px 60px; }
  .light { --ink: 22,24,28; --bg: #ffffff; --hot: #b7791f; --bad: #c2412d; background: var(--bg); }
  .dark  { --ink: 228,231,236; --bg: #0f1114; --hot: #e9b45a; --bad: #ef7d6b; background: var(--bg); }
  .tag { font: 600 8px/1 var(--mono); letter-spacing: 3px; color: rgba(var(--ink),.3); margin-bottom: 26px; }
  .sec { font: 600 9px/1 var(--mono); letter-spacing: 2.4px; color: rgba(var(--ink),.45); margin: 8px 0 26px; padding-bottom: 8px; border-bottom: .5px solid rgba(var(--ink),.14); }
  .dir { margin-bottom: 38px; }
  .dn { font-size: 12.5px; font-weight: 600; color: rgb(var(--ink)); }
  .dn i { font-style: normal; font-weight: 400; color: rgba(var(--ink),.38); margin-left: 6px; }
  .stack { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .m { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 10px; line-height: 1.6; }
  .a1 { color: rgb(var(--ink)); } .a2 { color: rgba(var(--ink),.62); } .a3 { color: rgba(var(--ink),.4); } .a4 { color: rgba(var(--ink),.24); }
  .hot { color: var(--hot); } .bad { color: var(--bad); }
  .el { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .r { text-align: right; }
  b { font-weight: 650; }

  /* process table: S | TIME+ | ID | COMMAND */
  .pt { display: grid; grid-template-columns: 1.5ch 5ch 4ch minmax(0,1fr); column-gap: 1.2ch; }
  .pt > .hd { font-size: 8.5px; letter-spacing: .6px; color: rgba(var(--ink),.45); }
  .bar { background: rgba(var(--ink),.07); }
  .pt.bar-hd > .hd { background: rgba(var(--ink),.07); margin: 0 -.6ch; padding: 0 .6ch; }
  .box { border: .5px solid rgba(var(--ink),.2); border-radius: 3px; padding: 4px 8px 5px; position: relative; }
  .box > .ttl { position: absolute; top: -7px; left: 8px; padding: 0 4px; background: var(--bg); font-size: 8.5px; letter-spacing: .6px; }
  .rule { border-top: .5px solid rgba(var(--ink),.14); margin: 3px 0; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
// honest data only: state, elapsed at observation, observed-at, exit code. no progress, no animation.
const RUN = { id:"9cec", tool:"bash", state:"running", cmd:"npm test -- --watch", time:"00:45", seen:"15:04:12" };
const OK  = { id:"a1b2", tool:"bash", state:"completed", cmd:"sleep 45 && echo done", time:"00:45", exit:0, seen:"15:03:27" };
const BAD = { id:"dead", tool:"web_fetch", state:"failed", cmd:"curl https://api.example.com/v2/endpoint", time:"00:03", exit:1, seen:"15:02:51" };
const ALL = [RUN, OK, BAD];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const S = t => t.state==="running" ? `<span class="hot">R</span>` : t.state==="failed" ? `<span class="bad">E</span>` : `<span class="a3">X</span>`;
const cmdHtml = t => { const [h,...r] = t.cmd.split(" "); return `<b class="a1">${esc(h)}</b> <span class="a2">${esc(r.join(" "))}</span>`; };
const rows = ts => ts.map(t => `${S(t)}<span class="a2">${t.time}</span><span class="a3">${t.id}</span><span class="el">${cmdHtml(t)}</span>`).join("");
const hd = `<span class="hd">S</span><span class="hd">TIME+</span><span class="hd">ID</span><span class="hd">COMMAND</span>`;
const nRun = ts => ts.filter(t=>t.state==="running").length;

/* ---------- htop running/list ×5 ---------- */
const H = [
  ["Classic", "反色表头 · 纯进程表", ts => `<div class="m"><div class="pt bar-hd">${hd}${rows(ts)}</div>
      <div class="a4" style="margin-top:2px">seen ${ts[0].seen}</div></div>`],

  ["Meters", "顶部摘要行 · 再接表", ts => `<div class="m">
      <div style="display:flex;gap:1ch"><span class="a3">Tasks: <span class="a1">${ts.length}</span>,</span><span class="hot">${nRun(ts)} running</span><span style="flex:1"></span><span class="a3">seen</span><span class="a2">${ts[0].seen}</span></div>
      <div class="rule"></div><div class="pt">${rows(ts)}</div></div>`],

  ["Tree", "F5 树视图 · meantime 为根", ts => `<div class="m">
      <div><b class="a1">meantime</b> <span class="a3">· seen ${ts[0].seen}</span></div>
      ${ts.map((t,i)=>`<div style="display:grid;grid-template-columns:3ch minmax(0,1fr) auto auto;column-gap:1ch">
        <span class="a4">${i===ts.length-1?"└─":"├─"}</span><span class="el">${cmdHtml(t)}</span><span class="a2">${t.time}</span>${S(t)}</div>`).join("")}</div>`],

  ["Boxed", "box-drawing 面板 · 标题嵌在边框上", ts => `<div class="m box" style="margin-top:6px">
      <span class="ttl a2">meantime <span class="a4">─</span> ${nRun(ts) ? `<span class="hot">${nRun(ts)} R</span>` : `<span class="a3">idle</span>`}</span>
      <div class="pt" style="margin-top:2px">${rows(ts)}</div>
      <div class="a4 r">seen ${ts[0].seen}</div></div>`],

  ["top(1)", "老 top · 无色块 · 列头小写", ts => `<div class="m">
      <div class="a3">top - ${ts[0].seen} · ${ts.length} tasks, ${nRun(ts)} running</div>
      <div class="pt" style="margin-top:3px"><span class="hd">s</span><span class="hd">time+</span><span class="hd">id</span><span class="hd">command</span>${rows(ts)}</div></div>`],
];

/* ---------- completion ×5, same htop diction ---------- */
const C = [
  ["Row exits", "进程表里最后一行 · 状态转 X/E", t => `<div class="m"><div class="pt bar-hd">${hd}${rows([t])}</div>
      <div class="a3" style="margin-top:2px">exited <span class="${t.exit?"bad":"a2"}">${t.exit}</span> <span class="a4">at ${t.seen}</span></div></div>`],

  ["Job done", "bash 作业通知 · [1]+ Done", t => `<div class="m" style="display:grid;grid-template-columns:4ch 7ch minmax(0,1fr);column-gap:1ch">
      <span class="a3">[${t.exit?2:1}]${t.exit?"-":"+"}</span>${t.exit?`<span class="bad">Exit ${t.exit}</span>`:`<span class="a2">Done</span>`}<span class="el">${cmdHtml(t)}</span>
      <span></span><span></span><span class="a4">${t.tool} ${t.id} · ${t.time}</span></div>`],

  ["dmesg", "内核日志一行 · 时间戳在前", t => `<div class="m el"><span class="a4">[+${t.time}]</span> <span class="a3">${t.tool}[${t.id}]:</span> <span class="a2">exited with status</span> <span class="${t.exit?"bad":"a1"}">${t.exit}</span>
      <div class="el" style="padding-left:10ch">${cmdHtml(t)}</div></div>`],

  ["Reaped", "wait(2) 回收单 · 三列账", t => `<div class="m" style="border-top:.5px solid rgba(var(--ink),.2);padding-top:4px">
      <div class="el">${cmdHtml(t)}</div>
      <div style="display:flex;gap:2ch"><span class="a3">reaped ${t.id}</span><span class="a3">time+ <span class="a2">${t.time}</span></span><span style="flex:1"></span><span class="a3">status</span><span class="${t.exit?"bad":"a1"}">${t.exit}</span></div></div>`],

  ["Boxed exit", "box 面板收口 · 边框上写退出码", t => `<div class="m box" style="margin-top:6px">
      <span class="ttl a2">${t.tool} ${t.id} <span class="a4">─</span> <span class="${t.exit?"bad":"a3"}">exit ${t.exit}</span></span>
      <div class="el" style="margin-top:2px">${cmdHtml(t)}</div>
      <div class="a4 r">${t.time} · ${t.seen}</div></div>`],
];

const sheet = document.getElementById("sheet");
for (const theme of ["light","dark"]) {
  const col = document.createElement("div");
  col.className = "col " + theme;
  col.innerHTML = `<div class="tag">${theme.toUpperCase()} · 390PT</div>
    <div class="sec">A · HTOP — RUNNING / LIST</div>` +
    H.map(([en,cn,f],i)=>`<div class="dir"><div class="dn">A${i+1} · ${en}<i>${cn}</i></div>
      <div class="stack">${f([RUN])}${f(ALL)}</div></div>`).join("") +
    `<div class="sec">B · COMPLETION</div>` +
    C.map(([en,cn,f],i)=>`<div class="dir"><div class="dn">B${i+1} · ${en}<i>${cn}</i></div>
      <div class="stack">${f(OK)}${f(BAD)}</div></div>`).join("");
  sheet.appendChild(col);
}
</script>
</body>
</html>
