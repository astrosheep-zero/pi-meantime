<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meantime · v15 · G variants</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font: 12px -apple-system, "SF Pro Text", sans-serif; padding: 24px; color: #e4e7ec; }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .intro { color: #899097; font-size: 12px; margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: repeat(4, 390px); gap: 22px; align-items: start; }
  .col > .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .col > .sub { color: #899097; font-size: 11px; margin-bottom: 12px; min-height: 30px; }
  .cell { margin-bottom: 14px; }
  .cell .lab { color: #5c6167; font-size: 10px; letter-spacing: .5px; margin-bottom: 4px; }
  .chat { background: #0f1114; border-radius: 10px; padding: 12px 16px; }
  .chat .prose { color: #c9cdd3; font-size: 13px; line-height: 19px; margin-bottom: 8px; }
  .m { font-family: Menlo, ui-monospace, monospace; font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; }
  .pre { white-space: pre-wrap; word-break: break-all; }
  .fg { color: #e4e7ec; } .mu { color: #899097; } .dm { color: #5c6167; } .out { color: #9aa0a8; }
  .ok { color: #7fb26a; } .bad { color: #ef7d6b; } .run { color: #e9b45a; }
  .glyph { width: 14px; flex: none; text-align: center; font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e9b45a; vertical-align: 1px; }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .grow { flex: 1; min-width: 0; }
  .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { flex: none; color: #899097; display: flex; gap: 8px; }
  .chev { color: #3f434a; }
  .foot { font-size: 11px; line-height: 16px; color: #5c6167; }

  
  
  .g { position: relative; overflow: hidden; border-radius: 8px; padding: 10px 14px 12px; }
  .g > * { position: relative; }
  .g .wm { position: absolute; pointer-events: none; }
  .g .cmdl { font-size: 14px; line-height: 20px; font-weight: 700; color: #f2f4f7; }
  .g .body { margin-top: 6px; } .g .foot { margin-top: 6px; }
  .g.ok { --c: 127,178,106; } .g.bad { --c: 239,125,107; } .g.run { --c: 233,180,90; }
  .tint { background: linear-gradient(135deg, rgba(var(--c),.16), rgba(var(--c),.03) 70%); border: 1px solid rgba(var(--c),.32); }
  /* G1 描边水印 */
  .G1 .wm { right: -4px; bottom: -20px; font: 900 88px/1 -apple-system, sans-serif; letter-spacing: -4px; color: transparent; -webkit-text-stroke: 1.5px rgba(var(--c),.22); }
  /* G2 竖排水印贴右边 */
  .G2 { padding-right: 44px; }
  .G2 .wm { right: 0; top: 0; bottom: 0; width: 34px; display: flex; align-items: center; justify-content: center; background: rgba(var(--c),.10); border-left: 1px solid rgba(var(--c),.25); }
  .G2 .wm span { writing-mode: vertical-rl; font: 900 22px/1 -apple-system, sans-serif; letter-spacing: 6px; color: rgba(var(--c),.55); }
  /* G3 时间做水印 */
  .G3 .wm { right: 8px; top: 2px; font: 800 52px/1 Menlo, monospace; letter-spacing: -3px; color: rgba(var(--c),.16); }
  /* G4 光晕 + 符号水印 */
  .G4 { background: radial-gradient(circle at 100% 0%, rgba(var(--c),.30), rgba(var(--c),.04) 55%, #0b0c0e 85%); border: 1px solid rgba(var(--c),.28); }
  .G4 .wm { right: 6px; top: -18px; font: 900 110px/1 -apple-system, sans-serif; color: rgba(var(--c),.13); }
</style>
</head>
<body>
<h1>v15 · G 的变体</h1>
<div class="intro">深色真实主题，Menlo 12/18，聊天栏宽 390。每列同一份数据：短命令收起/展开、长单行展开、多行失败展开、运行中收起。</div>
<div class="grid" id="grid"></div>
<script>
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const cases = [
 {lab:"短命令 · 收起", cmd:"npm test", st:"ok", t:"00:45", open:false, out:"ℹ fail 0\nℹ duration_ms 336.6"},
 {lab:"短命令 · 展开", cmd:"npm test", st:"ok", t:"00:45", open:true, out:"ℹ tests 25\nℹ suites 7\nℹ pass 25\nℹ fail 0\nℹ duration_ms 336.6", foot:"mt_9cec1234 · 19:31:28 → 19:32:13"},
 {lab:"长单行 · 展开", cmd:"rg -n --hidden -g '!node_modules' \"outputPath|outputTail\" plugins/paseo/client plugins/paseo/shared src", st:"ok", t:"00:01", open:true, out:"client/task-view.tsx:66:  const source = live ? task.outputTail\nshared/tasks.ts:41:  outputPath?: string;", foot:"mt_51ab07e2 · 19:40:02 → 19:40:03"},
 {lab:"多行失败 · 展开", cmd:"for f in test/*.test.ts; do\n  node --test \"$f\" || exit 1\ndone", st:"bad", t:"00:12", word:"exit 1", open:true, out:"✔ board renders (4ms)\n✖ drawer shows command once\n  AssertionError: 2 !== 1", foot:"mt_77d0c9aa · 19:44:10 → 19:44:22"},
 {lab:"运行中 · 收起", cmd:"npm run build -- --watch", st:"run", t:"02:13", open:false, out:"[watch] build started\n  dist/client.js  41.2kb\n  dist/server.js  12.8kb\n[watch] build finished\n[watch] waiting for changes…"},
];
const glyph = c => c.st==="ok" ? `<span class="glyph ok">✓</span>` : c.st==="bad" ? `<span class="glyph bad">✕</span>` : `<span class="glyph"><span class="dot"></span></span>`;
const split = cmd => { const m=/^\S+/.exec(cmd); return `<span class="fg">${esc(m[0])}</span><span class="mu">${esc(cmd.slice(m[0].length))}</span>`; };
const flat = cmd => cmd.replace(/\s+/g," ");
const meta = (c, chev=true) => `<span class="meta">${c.word?`<span class="bad">${c.word}</span>`:`<span>${c.t}</span>`}${chev?`<span class="chev">${c.open?"⌃":"⌄"}</span>`:""}</span>`;
const outText = c => esc(c.open ? c.out : c.out.split("\n").slice(c.st==="run"?-5:-2).join("\n"));

const C = c => c.st, W = c => c.st==="ok"?"PASS":c.st==="bad"?"FAIL":"LIVE";
const cmdH = c => c.open?esc(c.cmd):esc(flat(c.cmd));
const card = (cls, wm, c) => `<div class="g ${cls} ${C(c)} m"><div class="wm">${wm}</div><div class="row"><div class="grow cmdl ${c.open?"pre":"clip"}">${cmdH(c)}</div><span class="meta ${C(c)}">${c.word?c.word+" ":""}${c.t}</span></div><div class="body pre out">${outText(c)}</div>${c.open?`<div class="foot">${c.foot}</div>`:""}</div>`;
const SYM = c => c.st==="ok"?"✓":c.st==="bad"?"✕":"●";
const styles = {
 G1:{title:"G1 · 描边水印",sub:"水印换成空心描边字，不再糊在输出上。染色和 v14 的 G 一样。",r:c=>card("G1 tint",W(c),c)},
 G2:{title:"G2 · 竖排侧栏",sub:"水印竖排进右侧一条色带，状态字完整不裁切，输出区完全干净。",r:c=>card("G2 tint",`<span>${W(c)}</span>`,c)},
 G3:{title:"G3 · 时间当水印",sub:"右上角压巨号时间，状态只靠染色表达。看一眼就知道跑了多久。",r:c=>card("G3 tint",c.t,c)},
 G4:{title:"G4 · 光晕 + 符号",sub:"右上角一团状态色光晕，叠一个巨大的 ✓ ✕ ●，越往左下越暗。",r:c=>card("G4",SYM(c),c)},
};
document.getElementById("grid").innerHTML = Object.values(styles).map(s=>`<div class="col"><div class="title">${s.title}</div><div class="sub">${s.sub}</div>${
  cases.map(c=>`<div class="cell"><div class="lab">${c.lab}</div><div class="chat">${s.r(c)}</div></div>`).join("")}</div>`).join("");

</script>
</body>
</html>
